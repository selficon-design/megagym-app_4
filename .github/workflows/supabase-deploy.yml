# ΦΟΡΜΑ — αυτόματη ενημέρωση του Supabase.
# Κάθε φορά που αλλάζει κάτι μέσα στον φάκελο supabase/ :
#   1. τρέχει στη βάση όσα νέα αρχεία SQL υπάρχουν στο supabase/migrations/
#   2. κάνει Deploy την Edge Function analyze-meal
# Το index.html ενημερώνεται μόνο του από το GitHub Pages.
#
# Χρειάζεται δύο Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — από supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — ο κωδικός της βάσης (Project Settings → Database)
name: Ενημέρωση Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "!supabase/diagnostics/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: exxjwjfjwvkenncyaqvc
    steps:
      - uses: actions/checkout@v4

      - name: Έλεγχος Secrets
        run: |
          if [ -z "$RAW_TOKEN" ] || [ -z "$RAW_PASS" ]; then
            echo "::error::Λείπουν τα Secrets SUPABASE_ACCESS_TOKEN ή SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Καθαρισμός κενών/αλλαγών γραμμής που μπαίνουν συχνά με την επικόλληση
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          PASS=$(printf '%s' "$RAW_PASS" | tr -d '\r\n')
          echo "::add-mask::$TOKEN"; echo "::add-mask::$PASS"
          { echo "SUPABASE_ACCESS_TOKEN=$TOKEN"; echo "SUPABASE_DB_PASSWORD=$PASS"; } >> "$GITHUB_ENV"
          # Διάγνωση χωρίς να φαίνεται το κλειδί: μόνο ο τύπος (7 πρώτοι χαρακτήρες) και το μήκος
          echo "::notice title=Κλειδί Supabase::τύπος ${TOKEN:0:7}… · μήκος ${#TOKEN} (αρχικό μήκος ${#RAW_TOKEN})"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Κάθε εντολή: αν αποτύχει, το μήνυμα σφάλματος εμφανίζεται ως «annotation»
      # στη σελίδα της εκτέλεσης (για εύκολη διάγνωση).
      - name: Σύνδεση με το project
        run: |
          run() { local t="$1"; shift; if ! "$@" >out.log 2>&1; then cat out.log; m=$(tail -n 12 out.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$t::$m"; exit 1; fi; cat out.log; }
          declare -f run > "$RUNNER_TEMP/run.sh"
          run "Σύνδεση με το project" supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Τα τρία πρώτα SQL έχουν ήδη τρέξει χειροκίνητα στο SQL Editor·
      # τα σημειώνουμε ως «έτοιμα» ώστε να μην ξανατρέξουν.
      - name: Σήμανση SQL που έτρεξαν χειροκίνητα
        run: |
          source "$RUNNER_TEMP/run.sh"
          run "Σήμανση SQL" supabase migration repair --status applied 20261004000000 20261004000001 20261005000000 --password "$SUPABASE_DB_PASSWORD"

      - name: Νέα SQL στη βάση
        run: |
          source "$RUNNER_TEMP/run.sh"
          run "Νέα SQL στη βάση" supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Function analyze-meal
        run: |
          source "$RUNNER_TEMP/run.sh"
          run "Deploy analyze-meal" supabase functions deploy analyze-meal --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
