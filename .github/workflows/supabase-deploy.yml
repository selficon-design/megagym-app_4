# ΦΟΡΜΑ — αυτόματη ενημέρωση του Supabase.
# Κάθε φορά που αλλάζει κάτι μέσα στον φάκελο supabase/ :
#   1. τρέχει στη βάση όσα νέα αρχεία SQL υπάρχουν στο supabase/migrations/
#   2. κάνει Deploy την Edge Function analyze-meal
# Το index.html ενημερώνεται μόνο του από το GitHub Pages.
#
# Χρειάζεται δύο Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — από supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — ο κωδικός της βάσης (Project Settings → Database)
name: Ενημέρωση Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: exxjwjfjwvkenncyaqvc
    steps:
      - uses: actions/checkout@v4

      - name: Έλεγχος Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Λείπουν τα Secrets SUPABASE_ACCESS_TOKEN ή SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Σύνδεση με το project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Τα τρία πρώτα SQL έχουν ήδη τρέξει χειροκίνητα στο SQL Editor·
      # τα σημειώνουμε ως «έτοιμα» ώστε να μην ξανατρέξουν.
      - name: Σήμανση SQL που έτρεξαν χειροκίνητα
        run: supabase migration repair --status applied 20261004000000 20261004000001 20261005000000 --password "$SUPABASE_DB_PASSWORD"

      - name: Νέα SQL στη βάση
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy Edge Function analyze-meal
        run: supabase functions deploy analyze-meal --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
