# ΦΟΡΜΑ — τελευταία σφάλματα της υπηρεσίας AI (μόνο γραμμές «Anthropic error/fetch failed»).
# ΠΡΟΣΟΧΗ: το repository είναι δημόσιο· εμφανίζονται ΜΟΝΟ τα μηνύματα σφάλματος του AI (όχι δεδομένα πελατών).
name: Σφάλματα AI (logs)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: exxjwjfjwvkenncyaqvc
    steps:
      - name: Logs
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$T"
          START=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ); END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for TB in all; do
            SQL="SELECT timestamp, event_message FROM logs WHERE event_message LIKE '%Anthropic%' ORDER BY timestamp DESC LIMIT 6"
            curl -sS -G "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" \
              -H "Authorization: Bearer $T" --data-urlencode "sql=$SQL" \
              --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END" > out.json
            TB=$TB python3 - <<'PY'
          import json, os
          d=json.load(open('out.json')); tb=os.environ['TB']
          rows=d.get('result') or []
          if not rows: print(f'::notice title={tb}::Κανένα αποτέλεσμα ή', json.dumps(d)[:300])
          for r in rows:
              m=str(r.get('event_message',''))[:700].replace('%','%25').replace('\n','%0A')
              print(f"::notice title={tb}::{r.get('timestamp')} {m}")
          PY
          done
