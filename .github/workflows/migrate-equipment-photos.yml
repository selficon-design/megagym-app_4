# ΦΟΡΜΑ — μεταφορά των φωτογραφιών εξοπλισμού από το Wix στο Supabase Storage.
# Κατεβάζει κάθε φωτογραφία (όπως είναι, χωρίς αλλοίωση ποιότητας) από τα links του
# EQUIPMENT_BY_EXERCISE στο index.html και την ανεβάζει στο bucket library-images/equipment/
# με το ίδιο όνομα αρχείου (το «~» γίνεται «-»). Ό,τι έχει ήδη ανέβει παραλείπεται, άρα μπορεί να ξανατρέξει.
# Τα βίντεο ΔΕΝ μεταφέρονται.
name: Μεταφορά φωτογραφιών εξοπλισμού

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: exxjwjfjwvkenncyaqvc
      BUCKET: library-images
    steps:
      - uses: actions/checkout@v4
      - name: Μεταφορά
        run: |
          set -u
          export SUPABASE_ACCESS_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          # Κλειδί διακομιστή από το Management API (κρύβεται στα logs)
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" > keys.json \
            || { echo "::error title=Κλειδιά::Δεν μπόρεσα να πάρω τα κλειδιά του project"; exit 1; }
          KEY=$(jq -r '([.[] | select(.name=="service_role" and (.api_key|startswith("eyJ")))] + [.[] | select(.type=="secret")])[0].api_key // empty' keys.json)
          rm -f keys.json
          [ -n "$KEY" ] || { echo "::error title=Κλειδιά::Δεν βρέθηκε κλειδί διακομιστή"; exit 1; }
          echo "::add-mask::$KEY"
          AUTH=(-H "apikey: $KEY"); case "$KEY" in eyJ*) AUTH+=(-H "Authorization: Bearer $KEY");; esac
          API="https://$PROJECT_REF.supabase.co/storage/v1/object"

          PUBLIC="https://$PROJECT_REF.supabase.co/storage/v1/object/public/$BUCKET/equipment"
          mkdir -p equipment
          grep -o 'https://static\.wixstatic\.com/media/[^"]*' index.html | sort -u > urls.txt
          total=$(wc -l < urls.txt); ok=0; skipped=0; failed=""
          while read -r url; do
            name="${url##*/}"; dest="${name//\~/-}"   # το «~» δεν επιτρέπεται στο Storage → «-»
            if ! curl -fsSL --retry 3 --max-time 60 -o "equipment/$name" "$url"; then failed="$failed $name(λήψη)"; continue; fi
            size=$(stat -c %s "equipment/$name")
            type=$(file -b --mime-type "equipment/$name")
            case "$type" in image/*) ;; *) failed="$failed $name($type)"; continue;; esac
            remote=$(curl -sI "$PUBLIC/$dest" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
            if [ "$remote" = "$size" ]; then skipped=$((skipped+1)); continue; fi
            code=$(curl -s -o up.json -w '%{http_code}' -X POST "$API/$BUCKET/equipment/$dest" "${AUTH[@]}" \
                    -H "Content-Type: $type" -H "x-upsert: true" -H "cache-control: max-age=31536000" --data-binary "@equipment/$name")
            if [ "$code" = "200" ]; then
              remote=$(curl -sI "$PUBLIC/$dest" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
              if [ "$remote" = "$size" ]; then ok=$((ok+1)); else failed="$failed $name(έλεγχος:$remote/$size)"; fi
            else
              failed="$failed $name(ανέβασμα $code: $(head -c 120 up.json))"
            fi
          done < urls.txt
          echo "Σύνολο $total · ανέβηκαν $ok · υπήρχαν ήδη $skipped"
          echo "::notice title=Αποτέλεσμα::Σύνολο $total · ανέβηκαν $ok · υπήρχαν ήδη $skipped · αποτυχίες: ${failed:-καμία}"
          [ -z "$failed" ] || exit 1
