<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEGA GYM v040 — JSON Data</title>
<style>
:root{--gold:#d4af37;--gold2:#f2d56b;--panel:#171717;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
button,a{font:inherit}
.app{max-width:780px;margin:auto;min-height:100vh;background:linear-gradient(#080808,#111)}
.screen{display:none;min-height:100vh;padding:18px 16px 46px}
.screen.active{display:block}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 20px;background:radial-gradient(circle at top,#353535,#080808 58%,#000)}
.logo{color:var(--gold2);font-weight:900;letter-spacing:2px;font-size:14px}
h1{font-size:44px;line-height:.95;margin:12px 0}
h2{font-size:29px}
h3{margin:0 0 8px}
.muted{color:var(--muted);line-height:1.5}
.topbar{display:flex;gap:12px;align-items:center;position:sticky;top:0;background:linear-gradient(#080808 75%,transparent);padding:10px 0 16px;z-index:10}
.back{width:43px;height:43px;border-radius:50%;border:1px solid #444;background:#1b1b1b;color:#fff}
.btn{border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none}
.primary{background:var(--gold);color:#111}
.dark{background:#292929;color:#fff;border:1px solid #444}
.card{background:var(--panel);border:1px solid #303030;border-radius:20px;overflow:hidden;margin-bottom:14px}
.card-body{padding:17px}
.program-img{width:100%;height:190px;object-fit:cover;display:block}
.placeholder{background:linear-gradient(135deg,#292929,#151515);display:grid;place-items:center;text-align:center;color:#777;font-weight:800;padding:15px}
.badge{display:inline-block;background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.35);color:var(--gold2);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:9px}
.info{background:#1e1e1e;border-left:5px solid var(--gold);padding:12px;border-radius:10px;margin:9px 0}
.choice{width:100%;text-align:left;background:linear-gradient(135deg,#202020,#111);color:#fff;border:1px solid #333;border-radius:17px;padding:17px;margin-bottom:10px}
.choice b{display:block;color:var(--gold2);margin-bottom:6px}
.exercise-name{font-size:18px;font-weight:900}
.params{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.param{background:#202020;border-radius:12px;padding:11px}
.param span{display:block;font-size:11px;color:#aaa}
.param strong{color:var(--gold2)}
.equipment-card{display:grid;grid-template-columns:minmax(170px,40%) 1fr;background:#171717;border:1px solid #303030;border-radius:19px;overflow:hidden;margin-bottom:14px}
.machine-photo,.machine-placeholder{width:100%;height:100%;min-height:190px;max-height:240px;background:#0c0c0c;display:block}
.machine-photo{object-fit:contain}
.machine-placeholder{display:grid;place-items:center;text-align:center;color:#777;padding:12px;font-size:12px}
.eq-body{padding:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{width:100%;max-width:720px;max-height:92vh;overflow:auto;background:#151515;border:3px solid #3bd8ff;border-radius:20px;padding:16px}
.close{float:right;width:40px;height:40px;border-radius:50%;border:0;background:#303030;color:#fff;font-size:20px}
.full-image{width:100%;max-height:75vh;object-fit:contain;background:#0a0a0a;border-radius:14px}
.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
.notice{background:#292313;border:1px solid #615326;color:#ead98e;padding:13px;border-radius:12px}
.ok{background:#102416;border:1px solid #2f7d45;color:#b9f6c8;padding:13px;border-radius:12px;margin-bottom:12px}
@media(max-width:560px){
 .equipment-card{grid-template-columns:1fr}
 .machine-photo,.machine-placeholder{height:220px;min-height:220px}
 .actions{grid-template-columns:1fr 1fr}
}

.gender-actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
.tool-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.timer-wrap{text-align:center;padding:24px 16px}
.set-box{display:inline-block;border:1px solid #5b4b1a;background:#2a2413;color:var(--gold2);border-radius:12px;padding:10px 16px;font-weight:900;margin-bottom:18px}
.timer-number{font-size:88px;line-height:1;font-weight:900;letter-spacing:-4px;margin:8px 0 22px}
.timer-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer-status{min-height:24px;color:#aaa;margin-top:13px}
.calc-section{scroll-margin-top:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}
.field input,.field select{width:100%;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:12px;padding:13px}
.calc-result{font-size:36px;font-weight:900;color:var(--gold2);text-align:center;padding:20px}
.video-fullscreen{width:100%;height:100%;object-fit:contain;background:#000}
.empty-state{padding:24px;background:#171717;border:1px solid #303030;border-radius:18px;color:#bbb;text-align:center}
@media(max-width:560px){
 .timer-number{font-size:76px}
 .tool-buttons{grid-template-columns:1fr 1fr}
 .form-grid{grid-template-columns:1fr}
}


.calc-shell{padding:22px}
.calc-instruction{margin:0 0 18px;font-size:17px;font-weight:800;line-height:1.45;text-align:center}
.calc-type{margin:0 0 16px;padding:11px;border:1px solid #5b4b1a;border-radius:12px;background:#2a2413;color:var(--gold2);font-weight:900;text-align:center}
.calc-selector{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.calc-selector button{
  min-height:58px;
  border:2px solid #555555;
  border-radius:12px;
  background:#292929;
  color:#ffffff;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}
.calc-selector button:hover{border-color:#d71920}
.calc-selector button.active{
  background:#d71920;
  border-color:#d71920;
  box-shadow:0 0 0 4px rgba(215,25,32,.18);
}
.calc-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.calc-field{display:none}
.calc-field.visible{display:block}
.calc-field label{display:block;margin-bottom:6px;color:#bbb;font-size:12px;font-weight:800;text-align:center}
.calc-field input{width:100%;height:56px;border:2px solid #555;border-radius:11px;background:#101010;color:#fff;font-size:24px;font-weight:900;text-align:center}
.calc-field input.active-input{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.15)}
.calc-result-box{padding:18px;border-radius:15px;background:#111;border:1px solid #444}
.calc-result-label{text-align:center;font-size:15px;font-weight:800;color:#ddd;margin-bottom:9px}
.calc-next-weight{min-height:76px;display:flex;align-items:center;justify-content:center;border:2px solid var(--red);border-radius:13px;background:#202020;font-size:40px;font-weight:900}
.calc-next-weight small{margin-left:7px;font-size:17px;color:#bbb}
.calc-key-title{margin:20px 0 10px;text-align:center;color:#aaa;font-size:12px;font-weight:800;letter-spacing:1px}
.calc-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.calc-key{
  min-height:58px;
  border:none;
  border-radius:11px;
  background:#333333;
  color:#ffffff;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}
.calc-key:hover{background:#444444}
.calc-key:active{transform:scale(.96)}
.calc-key.clear{background:#652329}
.calc-key.delete{background:#594124}
.calc-action{
  width:100%;
  min-height:58px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:#d71920;
  color:#ffffff;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}
.calc-action:hover{
  background:#b9141a;
  transform:translateY(-1px);
}
.calc-action:active{transform:scale(.98)}
.calc-change-label{text-align:center;margin:17px 0 8px;font-weight:800;color:#ddd}
.calc-change{min-height:60px;display:flex;align-items:center;justify-content:center;border:2px solid #777;border-radius:12px;background:#101010;font-size:27px;font-weight:900}
.calc-change.positive{color:#42d477;border-color:#42d477}.calc-change.negative{color:#ff5252;border-color:#ff5252}
.calc-message{min-height:23px;margin-top:13px;text-align:center;color:#ccc;font-size:13px;font-weight:800;line-height:1.4}
.calc-message.error{color:#ff6767}
.calc-reset{width:100%;min-height:46px;margin-top:13px;border:1px solid #666;border-radius:11px;background:transparent;color:#ccc;font-weight:800}
@media(max-width:560px){.calc-fields{grid-template-columns:1fr 1fr}.calc-next-weight{font-size:35px}}


.tools-media-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.timer-running-note{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:#182218;border:1px solid #315731;color:#8fe08f;font-size:13px;font-weight:800;text-align:center}
.timer-paused-note{background:#292215;border-color:#665528;color:#e3c56f}
''.calculator-main-title{
  margin:0 0 14px;
  color:#ffffff;
  font-size:30px;
  line-height:1.15;
  font-weight:900;
  text-align:center;
  letter-spacing:.3px;
}
@media(max-width:560px){
  .calculator-main-title{font-size:25px}
}

/* Futuristic timer redesign */
.timer-wrap{
  position:relative;
  overflow:hidden;
  padding:28px 22px 24px;
  border:1px solid rgba(85,220,255,.35);
  border-radius:22px;
  background:
    radial-gradient(circle at 50% 18%,rgba(0,210,255,.16),transparent 34%),
    linear-gradient(145deg,#0b1118 0%,#111c27 52%,#090d12 100%);
  box-shadow:
    inset 0 0 32px rgba(0,185,255,.08),
    0 18px 40px rgba(0,0,0,.45);
}
.timer-wrap::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(65,200,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(65,200,255,.035) 1px,transparent 1px);
  background-size:22px 22px;
}
.timer-title{
  position:relative;
  z-index:1;
  margin:0 0 16px;
  color:#dffaff;
  font-size:19px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  text-shadow:0 0 7px rgba(0,210,255,.7);
}
.timer-ring{
  --progress:100;
  --ring-color:#32d36b;
  position:relative;
  z-index:1;
  width:220px;
  height:220px;
  margin:22px auto 18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at center,#0b1017 0 58%,transparent 59%),
    conic-gradient(var(--ring-color) calc(var(--progress)*1%),rgba(255,255,255,.09) 0);
  box-shadow:
    0 0 26px color-mix(in srgb,var(--ring-color) 48%,transparent),
    inset 0 0 28px rgba(0,0,0,.75);
  transition:background .25s linear,box-shadow .25s ease;
}
.timer-ring::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.11);
  box-shadow:inset 0 0 18px rgba(0,210,255,.12);
}
.timer-ring.warning{--ring-color:#ff9f1a}
.timer-ring.finished{--ring-color:#ff2e2e}
.timer-number{
  position:relative;
  z-index:2;
  margin:0;
  font-size:74px;
  line-height:1;
  font-weight:900;
  color:#f5fdff;
  text-shadow:0 0 18px rgba(0,210,255,.75);
}
.timer-number.warning{
  color:#63e879;
  text-shadow:0 0 14px rgba(70,255,105,.95);
  animation:timerPulseGreen .72s infinite;
}
.timer-number.finished{
  color:#ff3434;
  text-shadow:0 0 24px rgba(255,40,40,.95);
  animation:timerPulseRed .45s infinite;
}
.timer-ring.finished{
  animation:timerPulseRingRed .45s infinite;
}
.set-box{
  position:relative;
  z-index:1;
  margin:0 auto 8px;
}
.timer-controls,.timer-status,.timer-running-note,.timer-wrap>.btn{
  position:relative;
  z-index:1;
}
@keyframes timerPulseGreen{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.97)}
}
@keyframes timerPulseRed{
  0%,100%{opacity:1;transform:scale(1.04)}
  50%{opacity:.18;transform:scale(.96)}
}
@keyframes timerPulseRingRed{
  0%,100%{filter:brightness(1.35)}
  50%{filter:brightness(.45)}
}
@media(max-width:560px){
  .timer-ring{width:190px;height:190px}
  .timer-number{font-size:64px}
  .timer-title{font-size:16px;letter-spacing:1.4px}
}


/* =========================================================
   MEGA GYM FUTURISTIC TRAINING SYSTEM — GLOBAL THEME
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --bg-0:#05080d;
  --bg-1:#08111b;
  --glass:rgba(13,31,48,.68);
  --glass-strong:rgba(12,26,41,.86);
  --blue:#3bd8ff;
  --blue-soft:#88ecff;
  --orange:#ff9f1a;
  --orange-soft:#ffc061;
  --red:#ef2d35;
  --green:#37e56f;
  --text:#f3fbff;
  --muted:#9eb4c5;
  --line:rgba(76,208,255,.34);
  --shadow-blue:0 0 0 1px rgba(61,216,255,.16),0 0 24px rgba(0,178,255,.12),0 16px 42px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

html{
  min-height:100%;
  background:#05080d;
}

body{
  min-height:100vh;
  color:var(--text);
  font-family:'Rajdhani','Segoe UI',Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 8%,rgba(0,166,255,.18),transparent 28%),
    radial-gradient(circle at 86% 16%,rgba(255,133,26,.08),transparent 24%),
    linear-gradient(145deg,var(--bg-0),var(--bg-1) 52%,#030609);
  background-attachment:fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    linear-gradient(rgba(55,200,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(55,200,255,.035) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,.18));
}

body::after{
  content:"";
  position:fixed;
  left:50%;
  top:-220px;
  width:720px;
  height:720px;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:-1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(32,185,255,.12),transparent 64%);
  filter:blur(18px);
}

h1,h2,h3,.logo,.calculator-main-title,.timer-title{
  font-family:'Orbitron','Arial Black',sans-serif !important;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1,h2,h3{
  color:#ecfbff;
  text-shadow:0 0 16px rgba(61,216,255,.26);
}

.page,.screen,[id^="screen"]{
  animation:futuristicPageIn .32s ease both;
}

@keyframes futuristicPageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* Main containers and cards */
.card,
.program-card,
.exercise-card,
.equipment-card,
.info-card,
.result-section,
.calc-result-box,
.change-section,
.timer-wrap,
section{
  border-radius:20px !important;
}

.card,
.program-card,
.exercise-card,
.equipment-card,
.info-card{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(19,42,62,.78),rgba(7,17,28,.84)) !important;
  border:1px solid var(--line) !important;
  box-shadow:var(--shadow-blue) !important;
  backdrop-filter:blur(15px) saturate(135%);
  -webkit-backdrop-filter:blur(15px) saturate(135%);
}

.card::before,
.program-card::before,
.exercise-card::before,
.equipment-card::before,
.info-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg,rgba(255,255,255,.05),transparent 22%),
    radial-gradient(circle at 100% 0,rgba(61,216,255,.10),transparent 38%);
}

.card:hover,
.program-card:hover,
.exercise-card:hover,
.equipment-card:hover{
  border-color:rgba(74,225,255,.62) !important;
  box-shadow:
    0 0 0 1px rgba(74,225,255,.18),
    0 0 32px rgba(0,185,255,.18),
    0 18px 48px rgba(0,0,0,.50) !important;
}

/* Header / top navigation */
.topbar{
  padding:14px 16px !important;
  margin-bottom:18px;
  border:1px solid rgba(61,216,255,.32);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(12,31,48,.86),rgba(5,13,22,.86));
  box-shadow:0 0 16px rgba(0,184,255,.12),inset 0 0 18px rgba(0,184,255,.05);
  backdrop-filter:blur(16px);
}

.topbar .logo,.logo{
  color:#dffaff !important;
  text-shadow:
    0 0 7px rgba(61,216,255,.9),
    0 0 18px rgba(61,216,255,.48);
}

/* Buttons: blue = navigation */
.btn,
button{
  font-family:'Rajdhani','Segoe UI',Arial,sans-serif;
  letter-spacing:.045em;
}

.btn{
  min-height:52px;
  border-radius:13px !important;
  border:1px solid rgba(61,216,255,.58) !important;
  background:linear-gradient(145deg,rgba(19,53,75,.82),rgba(8,24,38,.92)) !important;
  color:#eefcff !important;
  box-shadow:
    inset 0 0 14px rgba(61,216,255,.08),
    0 0 16px rgba(0,185,255,.08);
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#56e2ff !important;
  box-shadow:
    inset 0 0 16px rgba(61,216,255,.12),
    0 0 16px rgba(0,190,255,.25);
}

.btn:active{transform:scale(.98)}

/* Orange = content actions: exercise, video, timer, calculator */
.actions .btn,
.tools-media-actions .btn,
button[onclick*="openExecution"],
button[onclick*="openEquipmentTools"]{
  border-color:rgba(255,159,26,.85) !important;
  background:linear-gradient(145deg,rgba(85,48,10,.52),rgba(25,18,10,.90)) !important;
  color:#fff7e9 !important;
  box-shadow:
    inset 0 0 14px rgba(255,159,26,.07),
    0 0 15px rgba(255,140,0,.10);
}

.actions .btn:hover,
.tools-media-actions .btn:hover,
button[onclick*="openExecution"]:hover,
button[onclick*="openEquipmentTools"]:hover{
  border-color:#ffb13b !important;
  box-shadow:
    inset 0 0 18px rgba(255,159,26,.12),
    0 0 24px rgba(255,140,0,.28);
}

/* Critical red actions */
#startBtn,
.calc-action,
button[onclick*="resetTimer"],
button[onclick*="resetCalculator"]{
  border-color:rgba(255,68,75,.92) !important;
  background:linear-gradient(145deg,#ef2d35,#9f1117) !important;
  color:#fff !important;
  box-shadow:
    inset 0 0 15px rgba(255,255,255,.06),
    0 0 14px rgba(239,45,53,.25);
}

#startBtn:hover,
.calc-action:hover,
button[onclick*="resetTimer"]:hover,
button[onclick*="resetCalculator"]:hover{
  box-shadow:0 0 30px rgba(239,45,53,.46);
}

/* Images and video */
img,video{
  border-radius:17px !important;
  border:1px solid rgba(61,216,255,.35);
  box-shadow:0 0 16px rgba(0,185,255,.13),0 14px 34px rgba(0,0,0,.42);
}

/* Form fields */
input,select,textarea{
  font-family:'Orbitron','Rajdhani',sans-serif;
  color:#f7fdff !important;
  background:rgba(3,11,18,.78) !important;
  border:1px solid rgba(61,216,255,.42) !important;
  box-shadow:inset 0 0 8px rgba(0,180,255,.05);
}

input:focus,select:focus,textarea:focus,.active-input{
  outline:none !important;
  border-color:#46dcff !important;
  box-shadow:0 0 0 3px rgba(61,216,255,.13),0 0 18px rgba(0,185,255,.18) !important;
}

/* Calculator module */
#calculatorSection{
  background:
    radial-gradient(circle at 50% 0,rgba(0,190,255,.11),transparent 28%),
    linear-gradient(145deg,rgba(11,28,43,.92),rgba(5,12,20,.96)) !important;
  border:1px solid rgba(61,216,255,.36) !important;
  box-shadow:var(--shadow-blue) !important;
}

.calculator-main-title{
  color:#e7fbff;
  text-shadow:0 0 18px rgba(61,216,255,.55);
}

.calc-selector button{
  border:1px solid rgba(255,159,26,.82) !important;
  background:linear-gradient(145deg,rgba(76,45,10,.64),rgba(27,18,8,.93)) !important;
  color:#fff6e6 !important;
}

.calc-selector button.active{
  background:linear-gradient(145deg,#ffad32,#d66e00) !important;
  color:#16100a !important;
  border-color:#ffc465 !important;
  box-shadow:0 0 0 4px rgba(255,159,26,.14),0 0 16px rgba(255,159,26,.28) !important;
}

.calc-key{
  border:1px solid rgba(61,216,255,.24) !important;
  background:linear-gradient(145deg,rgba(24,48,67,.82),rgba(8,20,31,.95)) !important;
  box-shadow:inset 0 0 7px rgba(61,216,255,.04);
}

.calc-key:hover{
  border-color:#53ddff !important;
  box-shadow:0 0 16px rgba(0,190,255,.18);
}

.calc-key.clear{
  border-color:rgba(239,45,53,.65) !important;
  background:linear-gradient(145deg,#6b2329,#321116) !important;
}
.calc-key.delete{
  border-color:rgba(255,159,26,.58) !important;
  background:linear-gradient(145deg,#654719,#2e210d) !important;
}

/* Futuristic labels */
.calc-type,.timer-status,.timer-running-note,.message{
  color:var(--muted) !important;
}

.set-box{
  padding:10px 14px !important;
  border:1px solid rgba(255,159,26,.55) !important;
  border-radius:12px !important;
  background:rgba(47,29,8,.46) !important;
  color:#ffd38b !important;
  text-shadow:0 0 7px rgba(255,159,26,.35);
}

/* Timer: preserve full futuristic module */
.timer-wrap{
  border-color:rgba(61,216,255,.42) !important;
  background:
    radial-gradient(circle at 50% 16%,rgba(0,210,255,.18),transparent 34%),
    linear-gradient(145deg,rgba(8,20,31,.96),rgba(11,28,43,.93) 52%,rgba(5,11,17,.98)) !important;
}

.timer-title{
  color:#e5fbff !important;
  text-shadow:0 0 8px rgba(61,216,255,.85),0 0 24px rgba(61,216,255,.35);
}

.timer-number{
  font-family:'Orbitron','Arial Black',sans-serif !important;
}

/* Entire ring flashes red at 0 */
.timer-ring.finished{
  --ring-color:#ff2e2e;
  background:
    radial-gradient(circle at center,#150508 0 58%,transparent 59%),
    conic-gradient(#ff2e2e 100%,#ff2e2e 0) !important;
  border:2px solid #ff4545;
  box-shadow:
    0 0 14px rgba(255,46,46,.95),
    0 0 52px rgba(255,46,46,.62),
    inset 0 0 34px rgba(255,0,0,.30) !important;
  animation:fullRedRingFlash .42s infinite !important;
}

.timer-ring.finished::after{
  border-color:rgba(255,100,100,.82) !important;
  box-shadow:inset 0 0 28px rgba(255,0,0,.28) !important;
}

@keyframes fullRedRingFlash{
  0%,100%{opacity:1;transform:scale(1.035);filter:brightness(1.5)}
  50%{opacity:.24;transform:scale(.97);filter:brightness(.55)}
}

/* Scrollbar */
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#05080d}
::-webkit-scrollbar-thumb{
  border-radius:999px;
  background:linear-gradient(#2ccdf4,#ff9f1a);
  border:2px solid #05080d;
}

/* Mobile */
@media(max-width:680px){
  body{background-attachment:scroll}
  .card,.program-card,.exercise-card,.equipment-card,.info-card{border-radius:16px !important}
  .topbar{border-radius:15px}
  h1{font-size:24px}
  h2{font-size:21px}
  .btn{min-height:50px}
}


.data-status{margin:12px auto;max-width:720px;padding:9px 12px;border-radius:10px;
border:1px solid rgba(55,229,111,.45);background:rgba(7,44,26,.42);color:#baf8ce;
font-size:13px;text-align:center}
.data-status.error{border-color:rgba(255,159,26,.65);background:rgba(65,35,5,.5);color:#ffd18b}

const DATA_URL='./mega_gym_data.json';
let dataLoadStatus={loaded:false,error:''};

async function loadAppData(){
  try{
    const response=await fetch(`${DATA_URL}?v=${Date.now()}`,{cache:'no-store'});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const loaded=await response.json();
    if(!loaded.programs || !loaded.exercises || !loaded.equipment){
      throw new Error('Μη έγκυρη δομή JSON');
    }
    DB=loaded;
    dataLoadStatus.loaded=true;
    dataLoadStatus.error='';
    renderHome();
  }catch(error){
    dataLoadStatus.loaded=false;
    dataLoadStatus.error=error.message||String(error);
    renderHome();
  }
}

let state={programCode:null,day:null,exerciseCode:null};
const $=id=>document.getElementById(id);

function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}
function back(id){return `<button class="back" onclick="show('${id}')">←</button>`;}
function img(url,label,cls){
  return url
    ? `<img class="${cls}" src="${url}" alt="${label}">`
    : `<div class="${cls==='machine-photo'?'machine-placeholder':'placeholder'}">${label}<br><small>Δεν υπάρχει URL στο Excel</small></div>`;
}
function youtubeEmbed(url){
  if(!url)return '';
  let id='';
  try{
    if(url.includes('youtu.be/')) id=url.split('youtu.be/')[1].split(/[?&]/)[0];
    else if(url.includes('youtube.com/watch')) id=new URL(url).searchParams.get('v')||'';
    else if(url.includes('youtube.com/embed/')) id=url.split('/embed/')[1].split(/[?&]/)[0];
  }catch(e){}
  return id?`https://www.youtube.com/embed/${id}`:'';
}

function openExecutionVideo(code){
  const x=DB.executions[code];
  if(!x||!x.video){
    $('modalBody').innerHTML=`
      <div class="logo">VIDEO</div>
      <h2>${x?x.name:'Εκτέλεση'}</h2>
      <div class="notice">Δεν έχει συμπληρωθεί video για τη συγκεκριμένη επιλεγμένη εκτέλεση.</div>`;
    $('modal').classList.add('show');
    return;
  }

  $('modalBody').innerHTML=`
    <div class="logo">VIDEO ΕΚΤΕΛΕΣΗΣ</div>
    <h2>${x.name}</h2>
    <video id="exerciseVideo" controls autoplay class="video-frame video-fullscreen">
      <source src="${x.video}" type="video/mp4">
    </video>`;
  $('modal').classList.add('show');

  const video=$('exerciseVideo');
  if(!video)return;
  video.play().catch(()=>{});
  try{
    if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    else if(video.requestFullscreen) video.requestFullscreen().catch(()=>{});
    else if(video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  }catch(err){}
}

  interval:null
};

function currentExerciseData(){
  return DB.exercises[state.exerciseCode] || {};
}

let selectedEquipment={
  code:'',
  name:'',
  executionCode:'',
  calculatorCode:'CALPIN 5',
  roundingStep:5
};

function getCalculatorConfig(equipmentCode){
  const eq=DB.equipment?.[equipmentCode]||{};
  const code=String(eq.calculatorCode||'CALPIN_5').toUpperCase().replace(/\./g,'_').replace(/\s+/g,'_');
  if(code.includes('CALALT')){
    return {calculatorCode:'CALALT 2.5',roundingStep:2.5,
      topText:'Τα κιλά υπολογίζονται σε κάθε αλτήρα ξεχωριστά',kgLabel:'Κιλά ενός αλτήρα'};
  }
  if(code.includes('2_5')){
    return {calculatorCode:'CALPIN 2.5',roundingStep:2.5,
      topText:'Τα κιλά υπολογίζονται στο σύνολο',kgLabel:'Κιλά'};
  }
  return {calculatorCode:'CALPIN 5',roundingStep:5,
    topText:'Τα κιλά υπολογίζονται στο σύνολο',kgLabel:'Κιλά'};
}

function parseRepRange(value){
  const numbers=String(value||'').match(/\d+(?:[.,]\d+)?/g)||[];
  const min=Math.max(1,Number(String(numbers[0]||8).replace(',','.')));
  const max=Math.max(min,Number(String(numbers[1]||numbers[0]||10).replace(',','.')));
  return {min,max};
}

function renderTimerSection(e,totalSets,maxRest){
  const statusText = timerState.running
    ? 'Η αντίστροφη μέτρηση εκτελείται και θα συνεχίσει ακόμη κι αν ανοίξεις ΑΣΚΗΣΗ ή VIDEO.'
    : timerState.paused
      ? 'Παύση. Το START θα συνεχίσει από το ίδιο σημείο χωρίς αλλαγή σετ.'
      : `Χρόνος διαλείμματος: ${timerState.max} sec`;

  const noteClass = timerState.paused ? 'timer-running-note timer-paused-note' : 'timer-running-note';
  const progress = timerState.max > 0 ? Math.max(0,(timerState.remaining/timerState.max)*100) : 0;

  return `
    <section id="timerSection" class="card">
      <div class="timer-wrap">
        <div class="timer-title">ΧΡΟΝΟΜΕΤΡΟ ΔΙΑΛΕΙΜΜΑΤΟΣ</div>

        <div id="setBox" class="set-box">ΕΠΟΜΕΝΟ ΣΕΤ 1 ΑΠΟ ${timerState.totalSets}</div>

        <div id="timerRing" class="timer-ring" style="--progress:${progress}">
          <div style="position:relative;z-index:2;text-align:center">
            <div id="timerNumber" class="timer-number">${timerState.remaining}</div>
            <div id="timerZeroMessage" style="display:none;margin-top:8px;font-family:Orbitron,Arial,sans-serif;font-size:11px;line-height:1.3;letter-spacing:1.4px;color:#ff7373;text-shadow:0 0 8px rgba(255,45,45,.75)">ΕΠΟΜΕΝΟ SET</div>
          </div>
        </div>

        <div class="timer-controls">
          <button id="startBtn" class="btn primary" onclick="startTimer()">START</button>
          <button class="btn dark" onclick="stopTimer()">STOP</button>
        </div>

        <div id="timerStatus" class="timer-status">${statusText}</div>

        <div class="${noteClass}">
          Μπορείς να ανοίξεις τη φωτογραφία ή το video χωρίς να μηδενιστεί ο χρόνος ή τα σετ.
        </div>

        <button class="btn dark" style="margin-top:12px;width:100%" onclick="resetTimer()">ΕΠΑΝΑΦΟΡΑ</button>
      </div>
    </section>`;
}

function renderCalculatorSection(e){
  const range=parseRepRange(e.reps);
  const cfg=selectedEquipment;
  return `
    <section id="calculatorSection" class="card calc-section">
      <div class="calc-shell">
        <div class="calculator-main-title">ΥΠΟΛΟΓΙΣΤΗΣ ΚΙΛΩΝ ΕΠΟΜΕΝΟΥ SET</div>
        <h2>${selectedEquipment.name}</h2>
        <div class="calc-type">${cfg.calculatorCode} · ${cfg.topText}</div>

        <p class="calc-instruction">
          Γράψε πόσες επαναλήψεις και πόσα κιλά είχες στο προηγούμενο σετ.
          Στόχος άσκησης: ${range.min}–${range.max} επαναλήψεις.
        </p>

        <div class="calc-selector">
          <button id="repsButton" onclick="selectCalcField('reps')">REPS</button>
          <button id="kgButton" onclick="selectCalcField('kg')">KG</button>
        </div>

        <div class="calc-fields">
          <div id="repsWrapper" class="calc-field">
            <label>ΕΠΑΝΑΛΗΨΕΙΣ</label>
            <input id="repsInput" type="text" inputmode="none" readonly placeholder="0">
          </div>
          <div id="kgWrapper" class="calc-field">
            <label>${cfg.kgLabel.toUpperCase()}</label>
            <input id="kgInput" type="text" inputmode="none" readonly placeholder="0">
          </div>
        </div>

        <div class="calc-key-title">ΠΛΗΚΤΡΟΛΟΓΙΟ ΑΡΙΘΜΩΝ</div>
        <div class="calc-keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="calc-key" onclick="addCalcNumber('${n}')">${n}</button>`).join('')}
          <button class="calc-key clear" onclick="clearCalcField()">C</button>
          <button class="calc-key" onclick="addCalcNumber('0')">0</button>
          <button class="calc-key delete" onclick="deleteCalcNumber()">⌫</button>
        </div>

        <button
          id="calculateNextSetButton"
          type="button"
          class="calc-action"
          onclick="calculateNextSetWeight()"
        >
          ΥΠΟΛΟΓΙΣΜΟΣ ΕΠΟΜΕΝΟΥ ΣΕΤ
        </button>

        <div class="calc-result-box" style="margin-top:18px">
          <div class="calc-result-label">Κιλά επόμενου σετ</div>
          <div id="nextWeight" class="calc-next-weight">—</div>
        </div>

        <div class="calc-change-label">Αύξηση ή μείωση κιλών</div>
        <div id="changeResult" class="calc-change">—</div>
        <div id="calcMessage" class="calc-message"></div>

        <button class="calc-reset" onclick="resetNextSetCalculator()">ΜΗΔΕΝΙΣΜΟΣ</button>
      </div>
    </section>`;
}

function initializeTimerForExercise(e){
  const maxRest=Math.max(1,parseInt(e.rest,10)||90);
  const totalSets=Math.max(1,parseInt(e.sets,10)||1);

  // Νέο χρονόμετρο μόνο όταν αλλάζει η άσκηση.
  // Η απλή πλοήγηση σε φωτογραφία/video/άλλη οθόνη δεν το μηδενίζει.
  if(timerState.exerciseCode!==state.exerciseCode){
    if(timerState.interval) clearInterval(timerState.interval);
    timerState.exerciseCode=state.exerciseCode;
    timerState.max=maxRest;
    timerState.remaining=maxRest;
    timerState.totalSets=totalSets;
    timerState.nextSet=1;
    timerState.running=false;
    timerState.paused=false;
    timerState.interval=null;
  }
}

function openTools(target){
  const e=currentExerciseData();
  initializeTimerForExercise(e);

  $('tools').innerHTML=`
    <div class="topbar">${back('exercise')}<div class="logo">MEGA GYM<div style="font-family:Orbitron,Arial,sans-serif;font-size:9px;letter-spacing:2.4px;color:#78ddf7;margin-top:3px">TRAINING SYSTEM</div></div></div>
    <h2>${e.name||'ΕΡΓΑΛΕΙΑ ΑΣΚΗΣΗΣ'}</h2>
    <div class="calc-type">${selectedEquipment.name}</div>

    <div class="tools-media-actions">
      <button class="btn primary" onclick="openExecutionPhoto('${selectedEquipment.executionCode}')">ΑΣΚΗΣΗ</button>
      <button class="btn dark" onclick="openExecutionVideo('${selectedEquipment.executionCode}')">VIDEO</button>
    </div>

    ${renderTimerSection(e,timerState.totalSets,timerState.max)}
    ${renderCalculatorSection(e)}`;

  show('tools');
  updateTimerUI();

  requestAnimationFrame(()=>{
    if(target==='calculator'){
      $('calculatorSection')?.scrollIntoView({behavior:'smooth',block:'start'});
    }else{
      window.scrollTo({top:0,behavior:'smooth'});
    }
  });
}

function openEquipmentTools(equipmentCode,equipmentName,executionCode,target){
  const cfg=getCalculatorConfig(equipmentCode);
  selectedEquipment={
    code:equipmentCode,
    name:equipmentName,
    executionCode:executionCode,
    calculatorCode:cfg.calculatorCode,
    roundingStep:cfg.roundingStep,
    topText:cfg.topText,
    kgLabel:cfg.kgLabel
  };
  openTools(target);
}

function updateTimerUI(){
  const numberEl=$('timerNumber');
  const ringEl=$('timerRing');
  const zeroMessage=$('timerZeroMessage');

  if(numberEl){
    numberEl.textContent=timerState.remaining;
    numberEl.classList.remove('warning','finished');
  }

  if(ringEl){
    const progress=timerState.max>0
      ? Math.max(0,(timerState.remaining/timerState.max)*100)
      : 0;
    ringEl.style.setProperty('--progress',progress);
    ringEl.classList.remove('warning','finished');
  }

  if(zeroMessage) zeroMessage.style.display='none';

  if(timerState.remaining===0){
    numberEl?.classList.add('finished');
    ringEl?.classList.add('finished');
    if(zeroMessage) zeroMessage.style.display='block';
  }else if(timerState.remaining<=10){
    numberEl?.classList.add('warning');
    ringEl?.classList.add('warning');
  }

  if($('setBox')){
    if(timerState.nextSet>timerState.totalSets){
      $('setBox').textContent='ΟΛΟΚΛΗΡΩΘΗΚΑΝ ΟΛΑ ΤΑ ΣΕΤ';
    }else{
      $('setBox').textContent=`ΕΠΟΜΕΝΟ ΣΕΤ ${timerState.nextSet} ΑΠΟ ${timerState.totalSets}`;
    }
  }

  if($('timerStatus')){
    if(timerState.running){
      $('timerStatus').textContent='Η αντίστροφη μέτρηση εκτελείται και συνεχίζει στο παρασκήνιο.';
    }else if(timerState.paused){
      $('timerStatus').textContent='Παύση. Το START θα συνεχίσει από το ίδιο σημείο χωρίς αλλαγή σετ.';
    }else if(timerState.remaining===0){
      $('timerStatus').textContent='Το διάλειμμα ολοκληρώθηκε.';
    }
  }
}

function clearFinishedFlash(){
  const numberEl=$('timerNumber');
  const ringEl=$('timerRing');
  numberEl?.classList.remove('finished');
  ringEl?.classList.remove('finished');
}

function startTimer(){
  if(timerState.running)return;

  if(timerState.remaining===0){
    if(timerState.nextSet>timerState.totalSets){
      if($('timerStatus')) $('timerStatus').textContent='Η άσκηση ολοκληρώθηκε. Πάτησε ΕΠΑΝΑΦΟΡΑ για νέο κύκλο.';
      return;
    }
    timerState.remaining=timerState.max;
    timerState.paused=false;
  }

  if(timerState.remaining===timerState.max && !timerState.paused){
    if(timerState.nextSet<timerState.totalSets){
      timerState.nextSet+=1;
    }else if(timerState.nextSet===timerState.totalSets){
      timerState.nextSet=timerState.totalSets+1;
    }
  }

  timerState.running=true;
  timerState.paused=false;
  if($('timerStatus')) $('timerStatus').textContent='Η αντίστροφη μέτρηση εκτελείται.';
  updateTimerUI();

  timerState.interval=setInterval(()=>{
    timerState.remaining-=1;
    if(timerState.remaining<=0){
      timerState.remaining=0;
      clearInterval(timerState.interval);
      timerState.interval=null;
      timerState.running=false;
      timerState.paused=false;
      if($('timerStatus')) $('timerStatus').textContent='Το διάλειμμα ολοκληρώθηκε.';
      setTimeout(clearFinishedFlash,3000);
      if(navigator.vibrate) navigator.vibrate([180,100,180]);
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value=880;
        gain.gain.setValueAtTime(.12,ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime+.22);
      }catch(e){}
    }
    updateTimerUI();
  },1000);
}

function stopTimer(){
  if(!timerState.running)return;
  clearInterval(timerState.interval);
  timerState.interval=null;
  timerState.running=false;
  timerState.paused=true;
  if($('timerStatus')) $('timerStatus').textContent='Παύση. Το START θα συνεχίσει από το ίδιο σημείο χωρίς αλλαγή σετ.';
}

function resetTimer(){
  if(timerState.interval) clearInterval(timerState.interval);
  timerState.interval=null;
  timerState.remaining=timerState.max;
  timerState.nextSet=1;
  timerState.running=false;
  timerState.paused=false;
  if($('timerStatus')) $('timerStatus').textContent=`Χρόνος διαλείμματος: ${timerState.max} sec`;
  updateTimerUI();
}

let activeCalcField=null;

function selectCalcField(field){
  activeCalcField=field;
  const reps=$('repsInput');
  const kg=$('kgInput');

  if(field==='reps'){
    $('repsWrapper')?.classList.add('visible');
    if(reps) reps.value='';
  }

  if(field==='kg'){
    $('kgWrapper')?.classList.add('visible');
    if(kg) kg.value='';
  }

  $('repsButton')?.classList.toggle('active',field==='reps');
  $('kgButton')?.classList.toggle('active',field==='kg');

  reps?.classList.toggle('active-input',field==='reps');
  kg?.classList.toggle('active-input',field==='kg');

  clearCalcResults();
}

function getActiveCalcInput(){
  return activeCalcField==='reps' ? $('repsInput') :
         activeCalcField==='kg' ? $('kgInput') : null;
}

function addCalcNumber(number){
  const input=getActiveCalcInput();
  if(!input){showCalcError('Πάτησε πρώτα REPS ή KG.');return;}
  const maxLength=activeCalcField==='reps'?3:5;
  if(input.value.length>=maxLength)return;
  input.value+=number;
  clearCalcResults();
}

function deleteCalcNumber(){
  const input=getActiveCalcInput();
  if(!input){showCalcError('Πάτησε πρώτα REPS ή KG.');return;}
  input.value=input.value.slice(0,-1);
  clearCalcResults();
}

function clearCalcField(){
  const input=getActiveCalcInput();
  if(!input){showCalcError('Πάτησε πρώτα REPS ή KG.');return;}
  input.value='';
  clearCalcResults();
}

function roundToStep(number,step){
  return Math.round(number/step)*step;
}

function calculateNextSetWeight(){
  const e=currentExerciseData();
  const range=parseRepRange(e.reps);
  const reps=Number($('repsInput')?.value);
  const kilograms=Number($('kgInput')?.value);
  const message=$('calcMessage');

  if(!$('repsInput')?.value || !$('kgInput')?.value){
    showCalcError('Συμπλήρωσε πρώτα τις επαναλήψεις και τα κιλά.');
    return;
  }
  if(!Number.isFinite(reps)||!Number.isFinite(kilograms)||reps<=0||kilograms<=0){
    showCalcError('Οι τιμές πρέπει να είναι μεγαλύτερες από το μηδέν.');
    return;
  }

  let weightPercent=0;
  let repsPercent=0;
  let explanation='';

  if(reps>=range.min && reps<=range.max){
    weightPercent=0;
    explanation=`Οι ${reps} επαναλήψεις βρίσκονται μέσα στον στόχο ${range.min}–${range.max}. Τα κιλά παραμένουν ίδια.`;
  }else if(reps>range.max){
    repsPercent=((reps-range.max)/range.max)*100;
    if(repsPercent<=60){
      weightPercent=repsPercent;
    }else{
      weightPercent=60+(repsPercent-60)*0.5;
    }
    weightPercent=Math.min(weightPercent,230);
    explanation=`Οι επαναλήψεις είναι ${formatCalcNumber(repsPercent)}% περισσότερες από το ανώτατο όριο ${range.max}.`;
  }else{
    repsPercent=((range.min-reps)/range.min)*100;
    weightPercent=-Math.min(repsPercent,90);
    explanation=`Οι επαναλήψεις είναι ${formatCalcNumber(repsPercent)}% λιγότερες από το κατώτατο όριο ${range.min}.`;
  }

  const rawNext=kilograms*(1+weightPercent/100);
  const nextWeight=Math.max(0,roundToStep(rawNext,selectedEquipment.roundingStep));
  const actualChange=nextWeight-kilograms;

  $('nextWeight').innerHTML=`${formatCalcNumber(nextWeight)}<small>KG</small>`;
  const change=$('changeResult');
  change.classList.remove('positive','negative');

  if(actualChange>0){
    change.textContent=`+${formatCalcNumber(actualChange)} KG`;
    change.classList.add('positive');
  }else if(actualChange<0){
    change.textContent=`${formatCalcNumber(actualChange)} KG`;
    change.classList.add('negative');
  }else{
    change.textContent='0 KG';
  }

  message.classList.remove('error');
  message.textContent=
    explanation+
    ` Υπολογισμένη μεταβολή: ${weightPercent>=0?'+':''}${formatCalcNumber(weightPercent)}%. `+
    `Στρογγυλοποίηση ανά ${String(selectedEquipment.roundingStep).replace('.',',')} kg.`;
}

function formatCalcNumber(number){
  const n=Math.round((Number(number)+Number.EPSILON)*10)/10;
  return Number.isInteger(n)?String(n):String(n).replace('.',',');
}

function clearCalcResults(){
  if($('nextWeight')) $('nextWeight').textContent='—';
  if($('changeResult')){
    $('changeResult').textContent='—';
    $('changeResult').classList.remove('positive','negative');
  }
  if($('calcMessage')){
    $('calcMessage').textContent='';
    $('calcMessage').classList.remove('error');
  }
}

function showCalcError(text){
  clearCalcResults();
  if($('calcMessage')){
    $('calcMessage').textContent=text;
    $('calcMessage').classList.add('error');
  }
}

function resetNextSetCalculator(){
  if($('repsInput')) $('repsInput').value='';
  if($('kgInput')) $('kgInput').value='';
  $('repsWrapper')?.classList.remove('visible');
  $('kgWrapper')?.classList.remove('visible');
  $('repsButton')?.classList.remove('active');
  $('kgButton')?.classList.remove('active');
  $('repsInput')?.classList.remove('active-input');
  $('kgInput')?.classList.remove('active-input');
  activeCalcField=null;
  clearCalcResults();
}

function closeModal(){$('modal').classList.remove('show');}
loadAppData();
</script>
