  const d = food.draft;
  const back = `<div class="auth-back" id="food-cancel">${ICON.back}Ακύρωση</div>`;
  const img = d.imgDataUrl ? `<img class="food-preview" src="${d.imgDataUrl}" alt="Φωτογραφία γεύματος">` : '';

  if(d.stage === 'photo'){
    return `${back}<div class="panel pad">
      ${img}
      <div class="field"><label>Σημείωση (προαιρετικό)</label>
        <input id="food-note-in" type="text" maxlength="300" placeholder="π.χ. 2 κ.σ. ελαιόλαδο, 200γρ. κοτόπουλο" value="${escAttr(d.note||'')}">
      </div>
      <div class="food-note" style="margin:-4px 0 14px;">Όσο περισσότερα μας πεις (λάδι, ποσότητες), τόσο πιο ακριβής η εκτίμηση.</div>
      <button class="btn btn-primary" id="food-analyze" style="width:100%;justify-content:center;">Ανάλυση γεύματος</button>
    </div>`;
  }
  if(d.stage === 'analyzing'){
    return `${back}<div class="panel pad" style="text-align:center;">
      ${img}<div class="food-spinner"></div>
      <div style="color:var(--ink-soft);font-size:13px;">Αναγνωρίζω τα τρόφιμα και υπολογίζω θερμίδες…</div>
    </div>`;
  }
  // review
  const t = foodSum(d.items);
  return `${back}<div class="panel pad">
    ${img}
    ${d.source==='photo' ? `<div class="food-note" style="margin:0 0 12px;">Βεβαιότητα εκτίμησης: <b>${escHtml(FOOD_CONFIDENCE_LABEL[d.confidence]||'μέτρια')}</b>${d.comment?' — '+escHtml(d.comment):''}</div>` : ''}
    <div class="field"><label>Γεύμα</label>
      <div class="chip-row">${FOOD_MEAL_TYPES.map(mt=>`<button type="button" class="kcal-btn ${d.mealType===mt.key?'active':''}" data-food-type="${mt.key}">${mt.label}</button>`).join('')}</div>
    </div>
    <div class="section-title"><span class="dot"></span>Τρόφιμα — διόρθωσε αν χρειάζεται</div>
    <div id="food-items">${d.items.map((it,i)=>renderFoodItemRow(it,i)).join('')}</div>
    <button class="btn btn-outline" id="food-add-item" style="width:100%;justify-content:center;margin:4px 0 14px;">+ Πρόσθεσε τρόφιμο</button>
    <div class="food-totals" id="food-draft-totals">${renderFoodDraftTotals(t)}</div>
    <button class="btn btn-green" id="food-save" style="width:100%;justify-content:center;margin-top:12px;">Αποθήκευση γεύματος</button>
    <div class="food-note">Αλλάζοντας τα γραμμάρια, οι θερμίδες και τα μακρο προσαρμόζονται αναλογικά.</div>
  </div>`;
}
function renderFoodDraftTotals(t){
  return `<div class="food-tile kcal"><div class="v">${Math.round(t.kcal)}</div><div class="k">kcal</div></div>
    <div class="food-tile"><div class="v">${Math.round(t.p)}</div><div class="k">Πρωτ. γ</div></div>
    <div class="food-tile"><div class="v">${Math.round(t.c)}</div><div class="k">Υδατ. γ</div></div>
    <div class="food-tile"><div class="v">${Math.round(t.f)}</div><div class="k">Λιπαρά γ</div></div>`;
}
function renderFoodItemRow(it, i){
  const num = (field, label)=>`<div><label>${label}</label><input type="number" inputmode="decimal" min="0" step="any" data-food-i="${i}" data-food-f="${field}" value="${it[field]||0}"></div>`;
  return `<div class="food-item">
    <div class="row1">
      <input class="name" type="text" placeholder="Γράψε τρόφιμο, π.χ. κοτόπουλο" data-food-i="${i}" data-food-f="name" value="${escAttr(it.name)}">
      <input class="grams" type="number" inputmode="decimal" min="0" step="any" data-food-i="${i}" data-food-f="grams" value="${it.grams||0}" aria-label="Γραμμάρια">
      <span style="font-size:12px;color:var(--ink-soft);">γρ.</span>
      <button class="x" data-food-rm="${i}" aria-label="Αφαίρεση">×</button>
    </div>
    <div class="macros">${num('kcal','kcal')}${num('protein_g','Πρωτ.')}${num('carbs_g','Υδατ.')}${num('fat_g','Λιπ.')}</div>
    ${it._p100 ? `<div class="fdb-per100" data-food-p100="${i}">Από τη βάση τροφίμων · ανά 100γρ.: ${fdbMacroLine(it._p100)}</div>` : ''}
  </div>`;
}

/* ---------- Events ---------- */
function bindFoodEvents(){
  const $ = id=>document.getElementById(id);
  document.querySelectorAll('[data-food-day]').forEach(b=>b.addEventListener('click', ()=>{
    const next = foodShiftDate(food.date, Number(b.getAttribute('data-food-day')));
    if(next > foodLocalISO(new Date())) return;
    food.date = next; renderClientNutrition();
  }));
  document.querySelectorAll('[data-food-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Διαγραφή αυτού του γεύματος;')) return;
    const id = b.getAttribute('data-food-del');
    if(await deleteMealLog(id)){
      food.meals = food.meals.filter(m=>String(m.id)!==String(id));
      toast('Το γεύμα διαγράφηκε.'); renderClientNutrition();
    } else toast('Σφάλμα διαγραφής.');
  }));

  const onPick = async (input)=>{
    const file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    try{
      const { dataUrl, b64 } = await foodCompressImage(file);
      food.draft = { stage:'photo', imgDataUrl:dataUrl, b64, note:'', items:[], mealType:foodDefaultMealType(), confidence:'medium', comment:'', source:'photo' };
      renderClientNutrition();
    }catch(e){ toast(e.message || 'Σφάλμα φωτογραφίας.'); }
  };
  if($('food-cam')) $('food-cam').addEventListener('change', e=>onPick(e.target));
  if($('food-gallery')) $('food-gallery').addEventListener('change', e=>onPick(e.target));
  if($('food-manual')) $('food-manual').addEventListener('click', ()=>{
    food.draft = { stage:'review', imgDataUrl:null, b64:null, note:'', items:[foodWithBase({ name:'', grams:100 })], mealType:foodDefaultMealType(), confidence:'medium', comment:'', source:'manual' };
    renderClientNutrition();
    const first = document.querySelector('#food-items input[data-food-f="name"]');
    if(first) first.focus();
  });

  if($('food-cancel')) $('food-cancel').addEventListener('click', ()=>{ food.draft = null; renderClientNutrition(); });
  if($('food-note-in')) $('food-note-in').addEventListener('input', e=>{ food.draft.note = e.target.value; });

  if($('food-analyze')) $('food-analyze').addEventListener('click', async ()=>{
    const d = food.draft; if(!d) return;
    d.stage = 'analyzing'; renderClientNutrition();
    try{
      const res = await analyzeMealPhoto(d.b64, d.note);
      if(food.draft !== d) return; // ακυρώθηκε στο μεταξύ
      if(!res || res.is_food === false || !(res.items||[]).length){
        d.stage = 'photo';
        renderClientNutrition();
        toast('Δεν αναγνωρίστηκε φαγητό. Δοκίμασε άλλη φωτογραφία ή πρόσθεσε χειροκίνητα.', 4000);
        return;
      }
      d.items = res.items.map(it=>{
        const x = foodWithBase(it);
        // Τρόφιμο που αναγνωρίστηκε από τη βάση: η αναλογία γίνεται με τις τιμές ανά 100γρ.
        if(it.per100 && Number(it.per100.kcal) >= 0){
          x._base = { grams:100, kcal:Number(it.per100.kcal)||0, protein_g:Number(it.per100.protein_g)||0, carbs_g:Number(it.per100.carbs_g)||0, fat_g:Number(it.per100.fat_g)||0 };
          x._p100 = x._base;
        }
        return x;
      });
      d.confidence = res.confidence || 'medium';
      d.comment = res.comment || '';
      d.stage = 'review';
      renderClientNutrition();
    }catch(e){
      if(food.draft !== d) return;
      d.stage = 'photo'; renderClientNutrition();
      toast(e.message || 'Η ανάλυση απέτυχε.', 4500);
    }
  });

  document.querySelectorAll('[data-food-type]').forEach(b=>b.addEventListener('click', ()=>{
    food.draft.mealType = b.getAttribute('data-food-type');
    document.querySelectorAll('[data-food-type]').forEach(x=>x.classList.toggle('active', x===b));
  }));

  // Επεξεργασία τροφίμων χωρίς πλήρες re-render (για να μη χάνεται το focus)
  document.querySelectorAll('#food-items [data-food-f]').forEach(inp=>inp.addEventListener('input', ()=>{
    const d = food.draft; if(!d) return;
    const i = Number(inp.getAttribute('data-food-i'));
    const f = inp.getAttribute('data-food-f');
    const it = d.items[i]; if(!it) return;
    if(f === 'name'){
      it.name = inp.value;
      if(it._p100){ delete it._p100; const l = document.querySelector(`[data-food-p100="${i}"]`); if(l) l.remove(); }
      return;
    }
    const v = Math.max(0, Number(inp.value) || 0);
    if(f === 'grams'){
      it.grams = v;
      const b = it._base;
      if(b && b.grams > 0){
        const k = v / b.grams;
        it.kcal = Math.round(b.kcal*k);
        it.protein_g = foodR1(b.protein_g*k); it.carbs_g = foodR1(b.carbs_g*k); it.fat_g = foodR1(b.fat_g*k);
        ['kcal','protein_g','carbs_g','fat_g'].forEach(ff=>{
          const el = document.querySelector(`#food-items [data-food-i="${i}"][data-food-f="${ff}"]`);
          if(el) el.value = it[ff];
        });
      }
    } else {
      it[f] = f==='kcal' ? Math.round(v) : foodR1(v);
      if(it._p100){ delete it._p100; const l = document.querySelector(`[data-food-p100="${i}"]`); if(l) l.remove(); }
      // Νέα βάση αναλογίας: ό,τι έγραψε ο χρήστης για τα τρέχοντα γραμμάρια
      it._base = { grams:it.grams, kcal:it.kcal, protein_g:it.protein_g, carbs_g:it.carbs_g, fat_g:it.fat_g };
    }
    const tot = document.getElementById('food-draft-totals');
    if(tot) tot.innerHTML = renderFoodDraftTotals(foodSum(d.items));
  }));
  document.querySelectorAll('[data-food-rm]').forEach(b=>b.addEventListener('click', ()=>{
    food.draft.items.splice(Number(b.getAttribute('data-food-rm')), 1);
    renderClientNutrition();
  }));
  if($('food-add-item')) $('food-add-item').addEventListener('click', ()=>{
    food.draft.items.push(foodWithBase({ name:'', grams:100 }));
    renderClientNutrition();
    const names = document.querySelectorAll('#food-items input[data-food-f="name"]');
    if(names.length) names[names.length-1].focus();
  });

  // Προτάσεις από τα πρόσφατα του πελάτη και τη βάση τροφίμων
  document.querySelectorAll('#food-items input[data-food-f="name"]').forEach(inp=>{
    fdbAttachSuggest(inp, {
      recent: ()=>food.recent,
      onPick: (e, kind)=>{
        const d = food.draft; if(!d) return;
        const i = Number(inp.getAttribute('data-food-i'));
        const it = d.items[i]; if(!it) return;
        if(kind === 'r'){ Object.assign(it, foodWithBase(e)); delete it._p100; }
        else foodApplyDb(it, e);
        renderClientNutrition();
        const g = document.querySelector(`#food-items [data-food-i="${i}"][data-food-f="grams"]`);
        if(g){ g.focus(); g.select(); }
      }
    });
  });

  if($('food-save')) $('food-save').addEventListener('click', async ()=>{
    const d = food.draft; if(!d) return;
    const items = d.items
      .filter(it=>(it.name||'').trim() && (Number(it.kcal)>0 || Number(it.grams)>0))
      .map(it=>({ name:it.name.trim().slice(0,80), grams:foodR1(it.grams), kcal:Math.round(Number(it.kcal)||0),
                  protein_g:foodR1(it.protein_g), carbs_g:foodR1(it.carbs_g), fat_g:foodR1(it.fat_g) }));
    if(!items.length){ toast('Πρόσθεσε τουλάχιστον ένα τρόφιμο με όνομα.'); return; }
    const t = foodSum(items);
    const btn = $('food-save'); btn.disabled = true; btn.textContent = 'Αποθήκευση…';
    const ok = await insertMealLog({
      customer_code: auth.customer ? auth.customer.code : null,
      meal_date: food.date,
      meal_type: d.mealType,
      items,
      total_kcal: Math.round(t.kcal),
      protein_g: foodR1(t.p), carbs_g: foodR1(t.c), fat_g: foodR1(t.f),
      note: d.note ? d.note.slice(0,300) : null,
      source: d.source
    });
    if(!ok){ btn.disabled = false; btn.textContent = 'Αποθήκευση γεύματος'; toast('Σφάλμα αποθήκευσης. Δοκίμασε ξανά.'); return; }
    foodRememberItems(items);
    food.draft = null; food.loadedFor = null;
    toast('Το γεύμα αποθηκεύτηκε! ' + Math.round(t.kcal) + ' kcal');
    renderClientNutrition();
  });
}

/* ===================================================================
   ΒΑΣΗ ΤΡΟΦΙΜΩΝ — πίνακας foods (θερμίδες & μακρο ανά 100γρ.).
   Τη διαβάζουν όλοι (αναζήτηση όταν γράφουν γεύμα), τη διορθώνει μόνο
   ο owner. Η αναζήτηση δουλεύει χωρίς τόνους και με greeklish
   (π.χ. "kotopoulo", "mprizola").
   =================================================================== */
const FDB_CATEGORIES = [
  'Κοτόπουλο & πουλερικά','Κρέας','Αλλαντικά','Ψάρια & θαλασσινά','Αυγά','Γαλακτοκομικά & τυριά',
  'Ψωμί & δημητριακά','Ρύζι, ζυμαρικά & πατάτες','Όσπρια','Λαχανικά','Φρούτα','Ξηροί καρποί & σπόροι',
  'Λάδια & λίπη','Σάλτσες & αλείμματα','Μαγειρευτά & φαγητά','Πίτες, σνακ & fast food','Γλυκά',
  'Ροφήματα','Συμπληρώματα','Άλλο'
];
const fdb = { list:null, promise:null, failedAt:0 };

// Κλειδί αναζήτησης: πεζά, χωρίς τόνους, ελληνικά → λατινικά με "χαλαρή" ορθογραφία,
// ώστε "κοτοπουλο", "Κοτόπουλο", "kotopoulo" και "kotopoylo" να ταιριάζουν.
const FDB_GR = {α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'ks',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'i',φ:'f',χ:'x',ψ:'ps',ω:'o'};
function fdbKey(s){
  let t = (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  t = t.replace(/ου/g,'ou').replace(/ει|οι|υι/g,'i').replace(/αι/g,'e').replace(/αυ/g,'av').replace(/ευ/g,'ev')
       .replace(/μπ/g,'b').replace(/ντ/g,'d').replace(/γκ|γγ/g,'g');
  t = t.replace(/[α-ω]/g, c=>FDB_GR[c]||c);
  t = t.replace(/8/g,'th').replace(/ch/g,'x').replace(/ph/g,'f')
       .replace(/ou/g,'\u0001').replace(/u/g,'\u0001').replace(/\u0001/g,'ou')
       .replace(/ei|oi|yi/g,'i').replace(/ai/g,'e').replace(/[hy]/g,'i').replace(/w/g,'o')
       .replace(/mp/g,'b').replace(/nt/g,'d').replace(/gk|gg/g,'g').replace(/b/g,'v').replace(/c/g,'k');
  return t.replace(/[^a-z0-9]+/g,' ').replace(/([a-z])\1+/g,'$1').trim();
}
function fdbLoad(force){
  if(force){ fdb.list = null; fdb.promise = null; fdb.failedAt = 0; }
  if(fdb.list) return Promise.resolve(fdb.list);
  if(fdb.promise) return fdb.promise;
  if(fdb.failedAt && Date.now() - fdb.failedAt < 30000) return Promise.resolve([]);
  fdb.promise = (async ()=>{
    const { data, error } = await sb.from('foods').select('*').order('name').range(0, 4999);
    fdb.promise = null;
    if(error){ console.warn('foods load error', error); fdb.failedAt = Date.now(); return []; }
    fdb.list = (data||[]).map(r=>({
      ...r, kcal:Number(r.kcal)||0, protein_g:Number(r.protein_g)||0, carbs_g:Number(r.carbs_g)||0, fat_g:Number(r.fat_g)||0,
      portion_grams: r.portion_grams!=null ? Number(r.portion_grams) : null, _k:fdbKey(r.name)
    }));
    return fdb.list;
  })();
  return fdb.promise;
}
// Αναζήτηση: κάθε λέξη του χρήστη πρέπει να υπάρχει στο όνομα. Πρώτα όσα ξεκινούν με τη λέξη.
function fdbSearch(items, q, max){
  const toks = fdbKey(q).split(' ').filter(Boolean);
  if(!toks.length) return [];
  const scored = [];
  for(const it of items){
    const k = it._k || (it._k = fdbKey(it.name));
    let ok = true, score = 0;
    for(const t of toks){
      const pos = k.indexOf(t);
      if(pos < 0){ ok = false; break; }
      score += pos === 0 ? 0 : (k[pos-1] === ' ' ? 1 : 3);
    }
    if(ok) scored.push([score + k.length/200 + (/\bom[oia]\b/.test(k) ? 0.5 : 0), it]); // τα «ωμά» πιο κάτω
  }
  scored.sort((a,b)=>a[0]-b[0]);
  return scored.slice(0, max).map(x=>x[1]);
}
function fdbMacroLine(e){
  return `${Math.round(e.kcal)} kcal · Π ${foodR1(e.protein_g)} · Υ ${foodR1(e.carbs_g)} · Λ ${foodR1(e.fat_g)}`;
}

// Λίστα προτάσεων κάτω από ένα πεδίο ονόματος τροφίμου.
// opts.recent(): πρόσφατα τρόφιμα του χρήστη (ή null) · opts.onPick(entry, 'r'|'db')
function fdbAttachSuggest(input, opts){
  let box = null, hideT = null;
  const close = ()=>{ if(box){ box.remove(); box = null; } };
  const show = ()=>{
    clearTimeout(hideT);
    const q = input.value.trim();
    const recent = (opts.recent && opts.recent()) || [];
    let rec, db;
    if(!q){ rec = recent.slice(0, 6); db = []; }
    else {
      rec = fdbSearch(recent, q, 3);
      db = fdbSearch(fdb.list || [], q, 15).filter(d=>!rec.some(r=>r._k === d._k));
    }
    let html = '';
    if(rec.length){
      html += `<div class="grp">Έχεις φάει πρόσφατα</div>` + rec.map((e,i)=>`<button type="button" data-fdb-kind="r" data-fdb-idx="${i}">
        <div class="n">${escHtml(e.name)}</div><div class="s">Τελευταία φορά: ${Math.round(e.grams)}γρ. · ${Math.round(e.kcal)} kcal</div></button>`).join('');
    }
    if(db.length){
      html += `<div class="grp">Βάση τροφίμων · ανά 100γρ.</div>` + db.map((e,i)=>`<button type="button" data-fdb-kind="db" data-fdb-idx="${i}">
        <div class="n">${escHtml(e.name)}</div><div class="s">${fdbMacroLine(e)}${e.portion_label&&e.portion_grams?` · ${escHtml(e.portion_label)} ≈ ${Math.round(e.portion_grams)}γρ.`:''}</div></button>`).join('');
    }
    if(!html){
      if(q.length >= 2 && fdb.list) html = `<div class="none">Δεν βρέθηκε στη λίστα — γράψε τις τιμές χειροκίνητα.</div>`;
      else { close(); return; }
    }
    if(!box){ box = document.createElement('div'); box.className = 'fdb-sugg'; input.insertAdjacentElement('afterend', box); }
    box.innerHTML = html;
    box.querySelectorAll('button[data-fdb-kind]').forEach(b=>{
      b.addEventListener('mousedown', ev=>ev.preventDefault()); // να μη χάνει το focus το πεδίο
      b.addEventListener('click', ()=>{
        const kind = b.getAttribute('data-fdb-kind'), idx = Number(b.getAttribute('data-fdb-idx'));
        const e = kind === 'r' ? rec[idx] : db[idx];
        close();
        if(e) opts.onPick(e, kind);
      });
    });
  };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', show);
  input.addEventListener('focus', show);
  input.addEventListener('blur', ()=>{ hideT = setTimeout(close, 180); });
  input.addEventListener('keydown', ev=>{ if(ev.key === 'Escape') close(); });
  if(!fdb.list) fdbLoad().then(()=>{ if(document.activeElement === input) show(); });
}

// Εφαρμόζει τιμές της βάσης σε ένα τρόφιμο του γεύματος.
// Νέα (κενή) γραμμή → παίρνει την τυπική μερίδα· αλλιώς κρατά τα γραμμάρια που υπάρχουν.
function foodApplyDb(it, e){
  const fresh = !(Number(it.kcal) > 0);
  let g = Number(it.grams) || 0;
  if(fresh && e.portion_grams) g = Number(e.portion_grams);
  if(!(g > 0)) g = 100;
  const k = g / 100;
  it.name = e.name;
  it.grams = foodR1(g);
  it.kcal = Math.round(e.kcal * k);
  it.protein_g = foodR1(e.protein_g * k); it.carbs_g = foodR1(e.carbs_g * k); it.fat_g = foodR1(e.fat_g * k);
  it._base = { grams:100, kcal:e.kcal, protein_g:e.protein_g, carbs_g:e.carbs_g, fat_g:e.fat_g };
  it._p100 = it._base;
}

/* ---------- Πρόσφατα τρόφιμα του πελάτη (από τα αποθηκευμένα γεύματά του) ---------- */
function foodRecentEntries(items){
  const out = [], seen = new Set();
  (items||[]).forEach(i=>{
    const name = (i && i.name || '').trim();
    if(!name || !(Number(i.grams) > 0)) return;
    const k = fdbKey(name);
    if(seen.has(k)) return; seen.add(k);
    out.push({ name, grams:foodR1(i.grams), kcal:Math.round(Number(i.kcal)||0), protein_g:foodR1(i.protein_g), carbs_g:foodR1(i.carbs_g), fat_g:foodR1(i.fat_g), _k:k });
  });
  return out;
}
function foodRememberItems(items){
  if(!food.recent) return;
  const add = foodRecentEntries(items);
  const keys = new Set(add.map(a=>a._k));
  food.recent = add.concat(food.recent.filter(r=>!keys.has(r._k))).slice(0, 300);
}
async function foodLoadRecent(){
  if(food.recent || food.recentLoading || !auth.user) return;
  food.recentLoading = true;
  const uid = auth.user.id;
  const { data, error } = await sb.from('meal_logs').select('items, created_at')
    .eq('user_id', uid).order('created_at', { ascending:false }).limit(150);
  food.recentLoading = false;
  if(!auth.user || auth.user.id !== uid) return;
  if(error){ console.warn('recent foods load error', error); food.recent = []; return; }
  const all = [];
  (data||[]).forEach(m=>{ if(Array.isArray(m.items)) all.push(...m.items); });
  food.recent = foodRecentEntries(all).slice(0, 300);
}

/* ===================================================================
   ΕΚΠΑΙΔΕΥΣΗ AI ΔΙΑΤΡΟΦΗΣ — μόνο για τον owner.
   Ο owner φωτογραφίζει ζυγισμένο φαγητό, βλέπει την "ωμή" εκτίμηση του AI
   και γράφει το πραγματικό βάρος. Οι διαφορές αποθηκεύονται στον πίνακα
   ai_food_calibration και η Edge Function τις εφαρμόζει σε όλους τους πελάτες.
   =================================================================== */
const aiTrain = { rows: [], loaded: false, draft: null, openKey: null };

function aiNormName(t){
  return (t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();

function aiTrainGroups(){
  const map = new Map();
  aiTrain.rows.forEach(r=>{
    const k = aiNormName(r.food_name);
    if(!map.has(k)) map.set(k, { key:k, name:r.food_name, rows:[] });
    map.get(k).rows.push(r);
  });
  return [...map.values()].map(g=>{
    const ai = g.rows.reduce((a,r)=>a+Number(r.ai_grams),0)/g.rows.length;
    const real = g.rows.reduce((a,r)=>a+Number(r.true_grams),0)/g.rows.length;
    return { ...g, ai, real, pct: Math.round((real/ai - 1)*100) };
  }).sort((a,b)=>b.rows.length - a.rows.length);
}

function bindAiTrainEvents(){
  const $ = id=>document.getElementById(id);
  const onPick = async (input)=>{
    const file = input.files && input.files[0]; input.value = '';
    if(!file) return;
    try{
      const { dataUrl, b64 } = await foodCompressImage(file);
      aiTrain.draft = { stage:'photo', imgDataUrl:dataUrl, b64, items:[] };
      renderAiTrainContent();
    }catch(e){ toast(e.message || 'Σφάλμα φωτογραφίας.'); }
  };
  if($('ait-cam')) $('ait-cam').addEventListener('change', e=>onPick(e.target));
  if($('ait-gallery')) $('ait-gallery').addEventListener('change', e=>onPick(e.target));
  if($('ait-cancel')) $('ait-cancel').addEventListener('click', ()=>{ aiTrain.draft = null; renderAiTrainContent(); });

  if($('ait-analyze')) $('ait-analyze').addEventListener('click', async ()=>{
    const d = aiTrain.draft; if(!d) return;
    d.stage = 'analyzing'; renderAiTrainContent();
    try{
      const res = await analyzeMealPhoto(d.b64, '', true);
      if(aiTrain.draft !== d) return;
      const items = (res && res.items) || [];
      if(!items.length){ d.stage='photo'; renderAiTrainContent(); toast('Δεν αναγνωρίστηκε φαγητό.'); return; }
      d.items = items.filter(it=>Number(it.grams)>0).map(it=>({ ai_name:it.name, name:it.name, ai_grams:Number(it.grams), true_grams:'' }));
      d.stage = 'review'; renderAiTrainContent();
    }catch(e){
      if(aiTrain.draft !== d) return;
      d.stage = 'photo'; renderAiTrainContent(); toast(e.message || 'Η ανάλυση απέτυχε.', 4500);
    }
  });

  document.querySelectorAll('[data-ait-f]').forEach(inp=>inp.addEventListener('input', ()=>{
    const it = aiTrain.draft && aiTrain.draft.items[Number(inp.getAttribute('data-ait-i'))];
    if(it) it[inp.getAttribute('data-ait-f')] = inp.value;
  }));
  // Ίδια ονόματα με τη βάση τροφίμων → σωστές διορθώσεις ανά τρόφιμο
  document.querySelectorAll('input[data-ait-f="name"]').forEach(inp=>{
    fdbAttachSuggest(inp, { onPick: e=>{
      const it = aiTrain.draft && aiTrain.draft.items[Number(inp.getAttribute('data-ait-i'))];
      if(it) it.name = e.name;
      inp.value = e.name;
    }});
  });
  document.querySelectorAll('[data-ait-rm]').forEach(b=>b.addEventListener('click', ()=>{
    aiTrain.draft.items.splice(Number(b.getAttribute('data-ait-rm')), 1); renderAiTrainContent();
  }));

  if($('ait-save')) $('ait-save').addEventListener('click', async ()=>{
    const d = aiTrain.draft; if(!d) return;
    const rows = d.items
      .filter(it=>(it.name||'').trim() && Number(it.true_grams) > 0 && Number(it.ai_grams) > 0)
      .map(it=>({ food_name:it.name.trim().slice(0,80), ai_name:(it.ai_name||'').slice(0,80), ai_grams:Math.round(Number(it.ai_grams)*10)/10, true_grams:Math.round(Number(it.true_grams)*10)/10 }));
    if(!rows.length){ toast('Γράψε το βάρος της ζυγαριάς σε τουλάχιστον ένα τρόφιμο.'); return; }
    const btn = $('ait-save'); btn.disabled = true; btn.textContent = 'Αποθήκευση…';
    if(!(await insertCalibrationRows(rows))){ btn.disabled = false; btn.textContent = 'Αποθήκευση ζυγίσματος'; toast('Σφάλμα αποθήκευσης.'); return; }
    aiTrain.draft = null; aiTrain.loaded = false;
    toast(rows.length === 1 ? 'Αποθηκεύτηκε 1 ζύγισμα. Ευχαριστώ!' : `Αποθηκεύτηκαν ${rows.length} ζυγίσματα.`);
    renderAiTrainContent();
  });

  document.querySelectorAll('[data-ait-open]').forEach(el=>el.addEventListener('click', ()=>{
    const k = el.getAttribute('data-ait-open');
    aiTrain.openKey = aiTrain.openKey === k ? null : k; renderAiTrainContent();
  }));
  document.querySelectorAll('[data-ait-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Διαγραφή αυτού του ζυγίσματος;')) return;
    const id = b.getAttribute('data-ait-del');
    if(await deleteCalibrationRow(id)){
      aiTrain.rows = aiTrain.rows.filter(r=>String(r.id)!==String(id));
      toast('Διαγράφηκε.'); renderAiTrainContent();
    } else toast('Σφάλμα διαγραφής.');
  }));
}

function getClientDayItems(record, dayIndex){
  if(record.subtype === 'cardio'){
    return (record.cardioSlots||[]).map(s=>({type:'cardio', ...s}));
  }
  const day = (record.days||[])[dayIndex];
  if(!day) return [];
  const weightsItems = (day.groups||[]).map(g=>({type:'muscle', groupLabel:g.groupLabel, exercise:g.exercise, set:g.set, rep:g.rep, rest:g.rest, failure:g.failure, equipment:g.equipment||[]}));
  if(record.subtype === 'combo'){
    const cardioItems = (day.cardioSlots||[]).map(s=>({type:'cardio', ...s}));
    return day.topSection==='cardio' ? [...cardioItems, ...weightsItems] : [...weightsItems, ...cardioItems];
  }
  return weightsItems;
}

function renderClientMain(){
  const content = document.getElementById('client-content');
  if(!content) return;
  const announcePanel = document.getElementById('client-announce-panel');
  const nav = state.clientNav;
  if(announcePanel) announcePanel.style.display = (nav.view==='programs') ? (announcePanel.innerHTML.trim()?'block':'none') : 'none';

  let html = '';
  if(nav.view==='programs' || !nav.programId){
    html = renderClientProgramsListView();
  } else {
    const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
    if(!p){ html = renderClientProgramsListView(); }
    else{
      const record = p.record;
      if(nav.view==='days'){ html = renderClientDaysListView(p, record); }
      else if(nav.view==='items'){ html = renderClientItemsListView(p, record, nav.dayIndex); }
      else if(nav.view==='exercise'){
        const items = getClientDayItems(record, nav.dayIndex);
        html = renderClientExerciseView(items[nav.itemIndex]);
      }
      else{ html = renderClientProgramsListView(); }
    }
  }
  content.innerHTML = html;
  bindClientNavEvents();
}

function bindClientNavEvents(){
  document.querySelectorAll('[data-open-program]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-open-program');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(!p) return;
      const record = p.record;
      state.clientNav = {
        view: record.subtype==='cardio' ? 'items' : 'days',
        programId: id,
        dayIndex: record.subtype==='cardio' ? null : 0,
        itemIndex: null
      };
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-open-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.clientNav.view = 'items';
      state.clientNav.dayIndex = parseInt(el.getAttribute('data-open-day'));
      state.clientNav.itemIndex = null;
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-open-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.clientNav.view = 'exercise';
      state.clientNav.itemIndex = parseInt(el.getAttribute('data-open-item'));
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-client-back]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = el.getAttribute('data-client-back');
      state.clientNav.view = target;
      if(target==='programs'){ state.clientNav.programId=null; state.clientNav.dayIndex=null; state.clientNav.itemIndex=null; }
      else if(target==='days'){ state.clientNav.itemIndex=null; }
      else if(target==='items'){ state.clientNav.itemIndex=null; }
      renderClientMain();
    });
  });
  document.querySelectorAll('[data-client-print]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-client-print');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      document.getElementById('print-area').innerHTML = buildPrintHtml(p.record, auth.customer);
      window.print();
    });
  });
  document.querySelectorAll('[data-client-pdf]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-client-pdf');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      generatePdfFromRecord(p.record, auth.customer);
    });
  });
  document.getElementById('client-open-intensity-graph')?.addEventListener('click', ()=>{
    const nav = state.clientNav;
    const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
    if(!p) return;
    const items = getClientDayItems(p.record, nav.dayIndex);
    const item = items[nav.itemIndex];
    if(item) openIntensityGraphModal(item);
  });
  document.getElementById('client-start-exercise')?.addEventListener('click', ()=>{
    const nav = state.clientNav;
    const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
    if(!p) return;
    const items = getClientDayItems(p.record, nav.dayIndex);
    const item = items[nav.itemIndex];
    if(item && item.type==='muscle'){
      state.workoutLogContext = { customerCode: auth.customer ? auth.customer.code : null, programName: getProgramNameForRecord(p.record) };
      openWorkoutMode(item, rebuildClientDashboardShell);
    }
  });
  document.querySelectorAll('[data-clientlib-eqphoto]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('photo', el.getAttribute('data-clientlib-eqphoto')); });
  });
  document.querySelectorAll('[data-clientlib-eqvideo]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('video', el.getAttribute('data-clientlib-eqvideo')); });
  });
  document.querySelectorAll('[data-clientlib-eqworkout]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nav = state.clientNav;
      const p = state.selectedCustomerPrograms.find(x=>x.id===nav.programId);
      try{
        state.workoutLogContext = { customerCode: auth.customer ? auth.customer.code : null, programName: p ? getProgramNameForRecord(p.record) : '' };
        openWorkoutMode(JSON.parse(el.getAttribute('data-clientlib-eqworkout')), rebuildClientDashboardShell);
      }catch(e){}
    });
  });
}

function renderTplLibMain(){

  else if(nav.view==='topcat') html = renderTplLibTopCatView();

function tplLibCurrentProgram(){
  return state.tplTemplates.find(t=>t.id===state.tplLibNav.programId) || null;
}
function mapTemplateToCustomRecord(t){
  const days = (t.data && t.data.days) || [];
  const isFatburn = t.top_category === 'ΚΑΥΣΗΣ ΛΙΠΟΥΣ';
  let category = 'muscle', subtype = null;
  if(isFatburn){
    category = 'fatburn';
    if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΒΑΡΗ') subtype = 'weights';
    else if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΑΕΡΟΒΙΟ') subtype = 'cardio';
    else subtype = 'combo';
  }
  const mappedDays = days.map(d=>{
    const groups = d.items.filter(it=>it.type==='muscle').map(it=>({
      groupLabel: it.groupLabel, exercise: it.exercise, set: it.set, rep: it.rep, rest: it.rest, failure: it.failure, equipment: it.equipment||[]
    }));
    const cardioSlots = d.items.filter(it=>it.type==='cardio').map(it=>({
      equipment: it.equipment, mode: it.mode, speedLow: it.speedLow, speedHigh: it.speedHigh, incline: it.incline, intensity: it.intensity, minutes: it.minutes, drillEveryMinutes: it.drillEveryMinutes
    }));
    return { label: d.label, groups, cardioSlots, topSection:'weights' };
  });
  const record = {
    category, subtype,
    notes: t.notes || '',
    instructions: t.description || '',
    nutrition: t.nutrition ? { kcal:'', text: t.nutrition } : null,
    days: null, cardioSlots: null,
    fromTemplate: true, templateName: t.name || ''
  };
  if(subtype === 'cardio'){
    record.cardioSlots = mappedDays.reduce((acc,d)=>acc.concat(d.cardioSlots),[]);
  } else {
    record.days = mappedDays.filter(d=> d.groups.length>0 || (d.cardioSlots && d.cardioSlots.length>0));
  }
  return record;
}
async function saveTemplateToMyPrograms(templateId){
  const t = state.tplTemplates.find(x=>x.id===templateId);
  if(!t || !auth.customer) return false;
  const record = mapTemplateToCustomRecord(t);
  return await insertProgram(auth.customer.code, record);
}

        <div class="calc-field-box"><label>Διάλειμμα</label><div class="val">${escHtml(it.rest)}</div></div>
      </div>
      <div class="calc-field-box" style="margin-bottom:14px;"><label>Ένταση</label><div class="val" style="font-size:15px;">${escHtml(failureLabel(it.failure))}</div></div>
      <div class="info-card"><div class="lbl">Τι σημαίνει η Ένταση (UNTIL FAILURE)</div><div class="txt">${escHtml(FAILURE_EXPLANATION)}</div></div>
      <button class="btn btn-critical" style="width:100%;justify-content:center;margin-top:6px;" id="tpllib-start-exercise">▶ Έναρξη Προπόνησης</button>
    </div>
    ${(it.equipment&&it.equipment.length) ? `
      <div class="eq-section-title">Προτεινόμενος Εξοπλισμός</div>
      ${it.equipment.map((eq,ei)=>`
        <div class="panel" style="margin-bottom:14px;overflow:hidden;">
          ${tplPhotoBlock(eq.photoUrl, 'ΦΩΤΟΓΡΑΦΙΑ ΜΗΧΑΝΗΜΑΤΟΣ')}
          <div class="pad">
            <div class="priority-badge">${ei+1}η ΠΡΟΤΕΡΑΙΟΤΗΤΑ</div>
            <h3 style="font-size:15px;margin-bottom:10px;">${escHtml(eq.name)}</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <button class="btn eq-action-btn" ${eq.exercisePhotoUrl?`data-tpllib-eqphoto="${escAttr(eq.exercisePhotoUrl)}"`:'disabled'}>ΑΣΚΗΣΗ</button>
              <button class="btn eq-action-btn" ${eq.videoUrl?`data-tpllib-eqvideo="${escAttr(eq.videoUrl)}"`:'disabled'}>VIDEO</button>
              <button class="btn eq-action-btn tall" data-tpllib-eqworkout="${it.exercise?escAttr(JSON.stringify({exercise:it.exercise,groupLabel:it.groupLabel,set:it.set,rep:it.rep,rest:it.rest,equipment:[eq]})):''}">ΧΡΟΝΟΜΕΤΡΟ</button>
              <button class="btn eq-action-btn tall" data-tpllib-eqworkout="${it.exercise?escAttr(JSON.stringify({exercise:it.exercise,groupLabel:it.groupLabel,set:it.set,rep:it.rep,rest:it.rest,equipment:[eq]})):''}">ΥΠΟΛΟΓΙΣΤΗΣ<br>KG</button>
              <button class="btn eq-action-btn" style="grid-column:span 2;" data-exinfo="${escAttr(JSON.stringify({exercise:it.exercise,set:it.set,rep:it.rep,rest:it.rest,failure:it.failure,eq:eq}))}">ΔΕΙΤΕ ΤΗΝ ΑΣΚΗΣΗ</button>
            </div>
          </div>
        </div>`).join('')}
    ` : ''}`;
}

function bindTplLibEvents(){
  document.querySelectorAll('[data-tpllib-gender]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav = { view:'topcat', gender: el.getAttribute('data-tpllib-gender'), topCategory:null, subCategory:null, programId:null, dayIndex:null, itemIndex:null };
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-topcat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cat = el.getAttribute('data-tpllib-topcat');
      state.tplLibNav.topCategory = cat;
      const hasSub = (TPL_CATEGORIES[cat]||[]).length>0;
      state.tplLibNav.view = hasSub ? 'subcat' : 'programs';
      state.tplLibNav.subCategory = hasSub ? null : null;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-subcat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'programs';
      state.tplLibNav.subCategory = el.getAttribute('data-tpllib-subcat');
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-program]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'detail';
      state.tplLibNav.programId = el.getAttribute('data-tpllib-program');
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-start]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'days';
      state.tplLibNav.dayIndex = 0;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-day]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'items';
      state.tplLibNav.dayIndex = parseInt(el.getAttribute('data-tpllib-day'));
      state.tplLibNav.itemIndex = null;
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tplLibNav.view = 'exercise';
      state.tplLibNav.itemIndex = parseInt(el.getAttribute('data-tpllib-item'));
      renderTplLibMain();
    });
  });
  document.querySelectorAll('[data-tpllib-back]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = el.getAttribute('data-tpllib-back');
      state.tplLibNav.view = target;
      if(target==='gender'){ state.tplLibNav = { view:'gender', gender:null, topCategory:null, subCategory:null, programId:null, dayIndex:null, itemIndex:null }; }
      else if(target==='topcat'){ state.tplLibNav.topCategory=null; state.tplLibNav.subCategory=null; state.tplLibNav.programId=null; }
      else if(target==='subcat'){ state.tplLibNav.subCategory=null; state.tplLibNav.programId=null; }
      else if(target==='programs'){ state.tplLibNav.programId=null; }
      else if(target==='detail'){ state.tplLibNav.dayIndex=null; }
      else if(target==='days'){ state.tplLibNav.itemIndex=null; }
      else if(target==='items'){ state.tplLibNav.itemIndex=null; }
      renderTplLibMain();
    });
  });
  document.getElementById('tpllib-open-intensity-graph')?.addEventListener('click', ()=>{
    const t = tplLibCurrentProgram();
    const day = t && (t.data.days||[])[state.tplLibNav.dayIndex];
    const it = day && day.items[state.tplLibNav.itemIndex];
    if(it) openIntensityGraphModal(it);
  });
  document.getElementById('tpllib-start-exercise')?.addEventListener('click', ()=>{
    const t = tplLibCurrentProgram();
    const day = t && (t.data.days||[])[state.tplLibNav.dayIndex];
    const it = day && day.items[state.tplLibNav.itemIndex];
    if(it && it.type==='muscle'){
      state.workoutLogContext = { customerCode: (auth.status==='client' && auth.customer) ? auth.customer.code : null, programName: t ? t.name : '' };
      openWorkoutMode(it, returnFromWorkoutTplLib);
    }
  });
  document.getElementById('tpllib-save-mine')?.addEventListener('click', async ()=>{
    const btn = document.getElementById('tpllib-save-mine');
    const id = btn.getAttribute('data-tpl-id');
    btn.disabled = true; btn.textContent = 'Αποθήκευση...';
    const ok = await saveTemplateToMyPrograms(id);
    btn.disabled = false; btn.innerHTML = ICON.save+'Αποθήκευση στα Προγράμματά μου';
    if(ok){
      toast('Το πρόγραμμα αποθηκεύτηκε στα δικά σου προγράμματα!');
      state.selectedCustomerPrograms = (await loadProgramsFor(auth.customer.code)).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    } else {
      toast('Σφάλμα αποθήκευσης. Δοκίμασε ξανά.');
    }
  });
  document.getElementById('tpllib-duplicate-edit')?.addEventListener('click', ()=>{
    const t = tplLibCurrentProgram();
    if(!t) return;
    const record = convertTemplateToProgramRecord(t);
    loadRecordIntoCustomBuilder(record, null, 'duplicate');
  });
  document.querySelectorAll('[data-tpllib-eqphoto]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('photo', el.getAttribute('data-tpllib-eqphoto')); });
  });
  document.querySelectorAll('[data-tpllib-eqvideo]').forEach(el=>{
    el.addEventListener('click', ()=>{ openLightbox('video', el.getAttribute('data-tpllib-eqvideo')); });
  });
  document.querySelectorAll('[data-tpllib-eqworkout]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const raw = el.getAttribute('data-tpllib-eqworkout');
      if(!raw) return;
      const t = tplLibCurrentProgram();
      try{
        state.workoutLogContext = { customerCode: (auth.status==='client' && auth.customer) ? auth.customer.code : null, programName: t ? t.name : '' };
        openWorkoutMode(JSON.parse(raw), returnFromWorkoutTplLib);
      }catch(e){}
    });
  });
}

function bindHistoryEvents(){
  const search = document.getElementById('hist-search');
  if(search){
    search.addEventListener('input', ()=>{ state.historySearch = search.value; renderHistoryListOnly(); });
  }
  document.querySelectorAll('[data-client]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const code = el.getAttribute('data-client');
      state.selectedCustomerCode = code;
      document.getElementById('hist-detail').innerHTML = `<div class="panel pad" style="color:var(--ink-soft);font-size:13px;">Φόρτωση προγραμμάτων...</div>`;
      state.selectedCustomerPrograms = (await loadProgramsFor(code)).sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
      render();
    });
  });
  bindHistoryDetailEvents();
}
function renderHistoryListOnly(){
  // re-render whole history tab (cheap) to keep code simple & correct
  render(true);
  const search = document.getElementById('hist-search');
  if(search){ search.focus(); search.selectionStart = search.selectionEnd = search.value.length; }
}
function bindHistoryDetailEvents(){
  bindWorkoutButtons(()=>render(true));
  document.getElementById('hist-load-log')?.addEventListener('click', async ()=>{
    const btn = document.getElementById('hist-load-log');
    const area = document.getElementById('hist-log-area');
    btn.disabled = true; btn.textContent = 'Φόρτωση...';
    btn.style.display = 'none';
    await loadAndRenderWorkoutLog(state.selectedCustomerCode, 'hist-log-area');
  });
  document.querySelectorAll('[data-hist-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-edit');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(p) loadRecordIntoCustomBuilder(p.record, p.id, 'edit');
    });
  });
  document.querySelectorAll('[data-hist-copyedit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-copyedit');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      if(p) loadRecordIntoCustomBuilder(p.record, p.id, 'copy');
    });
  });
  document.querySelectorAll('[data-tlhead]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-tlhead');
      state.openTlEntries[id] = !state.openTlEntries[id];
      render(true);
    });
  });
  document.querySelectorAll('[data-hist-print]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-print');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      const c = state.customers.find(x=>x.code===state.selectedCustomerCode);
      document.getElementById('print-area').innerHTML = buildPrintHtml(p.record, c);
      window.print();
    });
  });
  document.querySelectorAll('[data-hist-pdf]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-hist-pdf');
      const p = state.selectedCustomerPrograms.find(x=>x.id===id);
      const c = state.customers.find(x=>x.code===state.selectedCustomerCode);
      generatePdfFromRecord(p.record, c);
    });
  });
}

/* ===================================================================
   UTIL
   =================================================================== */
function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

/* ===================================================================
   MAIN RENDER
   =================================================================== */
/* ===================================================================
   ΜΗΝΥΜΑΤΑ (μόνο supervisor) — broadcast ανακοίνωση σε όλους τους πελάτες
   =================================================================== */
async function renderAnnouncementsTab(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topbar"><div><h1>Μηνύματα</h1><div class="sub">Στείλε ανακοίνωση που θα βλέπουν όλοι οι πελάτες</div></div></div>
    <div class="panel pad" style="margin-bottom:20px;">
      <div class="section-title"><span class="dot"></span>Νέο μήνυμα</div>
      <textarea id="announce-text" rows="3" style="width:100%;padding:11px 13px;border-radius:8px;border:1.5px solid var(--line);font-size:13.5px;font-family:inherit;resize:vertical;" placeholder="π.χ. Το γυμναστήριο θα είναι κλειστό την Κυριακή..."></textarea>
      <div class="action-bar" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="announce-send">${ICON.save}Αποστολή σε όλους</button>
      </div>
    </div>
    <div class="panel pad" id="announce-list">Φόρτωση...</div>
  `;
  document.getElementById('announce-send').addEventListener('click', async ()=>{
    const ta = document.getElementById('announce-text');
    const msg = ta.value.trim();
    if(!msg){ toast('Γράψε ένα μήνυμα πρώτα.'); return; }
    const btn = document.getElementById('announce-send');
    btn.disabled = true; btn.textContent = 'Αποστολή...';
    const ok = await sendAnnouncement(msg);
    btn.disabled = false; btn.innerHTML = ICON.save+'Αποστολή σε όλους';
    if(ok){ toast('Το μήνυμα στάλθηκε σε όλους τους πελάτες.'); ta.value=''; refreshAnnouncementList(); }
    else toast('Σφάλμα αποστολής.');
  });
  await refreshAnnouncementList();
}
async function refreshAnnouncementList(){
  const el = document.getElementById('announce-list');
  if(!el) return;
  const list = await loadAnnouncements();
  el.innerHTML = `
    <div class="section-title"><span class="dot"></span>Ιστορικό μηνυμάτων</div>
    ${list.length===0 ? `<div class="empty" style="padding:20px 0;"><div class="icon">💬</div><p>Δεν έχεις στείλει ακόμα κανένα μήνυμα.</p></div>` :
      list.map(a=>{
        const d = new Date(a.created_at);
        return `<div class="tl-card" style="margin-bottom:10px;padding:14px 16px;">
          <div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${d.toLocaleDateString('el-GR')} · ${d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}</div>
          <div style="font-size:13.5px;line-height:1.5;margin-bottom:8px;">${escHtml(a.message)}</div>
          <button class="btn btn-outline" data-announce-del="${a.id}" style="font-size:11px;padding:6px 10px;">Διαγραφή</button>
        </div>`;
      }).join('')
    }
  `;
  document.querySelectorAll('[data-announce-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-announce-del');
      btn.disabled = true;
      const ok = await deleteAnnouncement(id);
      if(ok) refreshAnnouncementList(); else { toast('Σφάλμα διαγραφής.'); btn.disabled=false; }
    });
  });
}

function render(skipNav){
  if(!skipNav) renderNav(); else { /* still refresh active states */ 
    document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.getAttribute('data-tab')===state.tab));
    document.querySelectorAll('.mobile-tabs button').forEach(el=>el.classList.toggle('active', el.getAttribute('data-tab')===state.tab));
  }
  const main = document.getElementById('main');
  if(state.tab==='builder'){
    main.innerHTML = renderBuilder();
    bindBuilderEvents();
  } else if(state.tab==='announcements'){
    renderAnnouncementsTab();
  } else if(state.tab==='tplbuilder'){
    renderTplBuilderTab();
  } else if(state.tab==='tplpreview'){
    renderTplPreviewTab();
  } else if(state.tab==='aitrain' && auth.role==='owner'){
    renderAiTrainTab();
  } else if(state.tab==='foodsdb' && auth.role==='owner'){
    renderFoodsDbTab();
  } else {
    main.innerHTML = renderHistory();
    bindHistoryEvents();
    if(!state.customersLoaded){
      loadCustomers().then(()=>render());
    }
  }
  renderModal();
}

/* ===================================================================
   ROOT DISPATCHER — αποφασίζει τι δείχνει η οθόνη ανάλογα με την
   κατάσταση σύνδεσης (φόρτωση / login / προπονητής / πελάτης)
   =================================================================== */
function renderRoot(){
  const authRoot = document.getElementById('auth-root');
  const appRoot = document.getElementById('app');
  const mobileTopbar = document.getElementById('mobile-topbar');

  if(auth.status === 'trainer'){
    authRoot.classList.add('hidden');
    appRoot.classList.remove('hidden');
    mobileTopbar.classList.remove('hidden');
    render();
  } else if(auth.status === 'client'){
    authRoot.classList.add('hidden');
    appRoot.classList.remove('hidden');
    mobileTopbar.classList.remove('hidden');
    renderAppClient();
  } else {
    appRoot.classList.add('hidden');
    mobileTopbar.classList.add('hidden');
    authRoot.classList.remove('hidden');
    renderAuthScreens();
  }
}

document.getElementById('mobile-logout')?.addEventListener('click', doLogout);

document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-eqpreview-name]');
  if(btn){
    const exercise = btn.getAttribute('data-eqpreview-exercise');
    const name = btn.getAttribute('data-eqpreview-name');
    const list = EQUIPMENT_BY_EXERCISE[exercise] || [];
    state.eqPreviewItem = list.find(e=>e.name===name) || { name };
    renderModal();
    return;
  }
  const exinfoBtn = e.target.closest('[data-exinfo]');
  if(exinfoBtn){
    try{ state.exerciseInfoItem = JSON.parse(exinfoBtn.getAttribute('data-exinfo')); }catch(err){ state.exerciseInfoItem = null; }
    renderModal();
  }
});

renderRoot();
resolveAuthState();

(function initScrollTopBtn(){
  const btn = document.getElementById('scroll-top-btn');
  if(!btn) return;
  window.addEventListener('scroll', ()=>{
    btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
  }, { passive:true });
  btn.addEventListener('click', ()=>{
    window.scrollTo({ top:0, behavior:'smooth' });
  });
})();
