function bindTplBuilderEvents(){
  const b = state.tplBuilder;
  document.querySelector('[data-gym-select]')?.addEventListener('change', (e)=>{
    state.selectedGym = e.target.value || null;
    renderTplFormArea();
  });
  document.querySelectorAll('[data-tpl-gender]').forEach(el=>{
    el.addEventListener('click', ()=>{ b.gender = el.getAttribute('data-tpl-gender'); renderTplFormArea(); });
  });
  document.querySelectorAll('[data-tpl-days]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const n = parseInt(el.getAttribute('data-tpl-days'));
      b.numDays = n;
      const newDays = tplBuildDays(n);
      newDays.forEach((d,i)=>{ if(b.days[i]) d.items = b.days[i].items; });
      b.days = newDays;
      renderTplFormArea();
    });
  });
  const bindText = (id, field)=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', ()=>{ b[field] = el.value; });
  };
  const topcatSel = document.getElementById('tpl-topcat');
  if(topcatSel) topcatSel.addEventListener('change', ()=>{ b.topCategory = topcatSel.value; b.subCategory=''; renderTplFormArea(); });
  const subcatSel = document.getElementById('tpl-subcat');
  if(subcatSel) subcatSel.addEventListener('change', ()=>{ b.subCategory = subcatSel.value; });
  bindText('tpl-topcatphoto','topCategoryPhoto');
  bindText('tpl-name','name'); bindText('tpl-photo','photo');
  bindText('tpl-description','description'); bindText('tpl-results','results'); bindText('tpl-nutrition','nutrition'); bindText('tpl-notes','notes');
  const sortEl = document.getElementById('tpl-sortorder');
  if(sortEl) sortEl.addEventListener('input', ()=>{ b.sortOrder = parseInt(sortEl.value)||0; });
  const pubToggle = document.getElementById('tpl-publish-toggle');
  if(pubToggle) pubToggle.addEventListener('click', ()=>{ b.isPublished = !b.isPublished; renderTplFormArea(); });

  document.querySelectorAll('[data-tpl-addform]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const di = parseInt(el.getAttribute('data-tpl-addform'));
      const type = el.getAttribute('data-tpl-addtype');
      b.addForm = type==='cardio'
        ? { dayIndex:di, type:'cardio', equipment:'', mode:'steady', speedLow:'', speedHigh:'', incline:'', intensity:'', minutes:'', drillEveryMinutes:'', editIndex:null }
        : { dayIndex:di, type:'muscle', groupLabel:'', exercise:'', customExercise:'', set:4, rep:TPL_REP_OPTIONS[3], rest:TPL_REST_OPTIONS[2], tempo:TPL_TEMPO_OPTIONS[0], failure:0,
            equipment:[], editIndex:null };
      renderTplFormArea();
    });
  });
  const cancelBtn = document.getElementById('tpl-af-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ b.addForm=null; renderTplFormArea(); });

  document.querySelectorAll('[data-tpl-edititem]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [di,ii] = el.getAttribute('data-tpl-edititem').split(':').map(Number);
      const it = b.days[di].items[ii];
      if(!it) return;
      b.addForm = it.type==='cardio'
        ? { dayIndex:di, type:'cardio', equipment:it.equipment, mode:it.mode, speedLow:it.speedLow, speedHigh:it.speedHigh, incline:it.incline, intensity:it.intensity, minutes:it.minutes, drillEveryMinutes:it.drillEveryMinutes, editIndex:ii }
        : { dayIndex:di, type:'muscle', groupLabel:it.groupLabel, exercise:it.exercise, customExercise:'', set:it.set, rep:it.rep, rest:it.rest, tempo:it.tempo, failure:it.failure,
            equipment: (it.equipment||[]).map(e=>({...e})), editIndex:ii };
      renderTplFormArea();
      document.getElementById('tpl-form-area')?.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  document.querySelectorAll('[data-tpl-removeitem]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [di,ii] = el.getAttribute('data-tpl-removeitem').split(':').map(Number);
      const it = b.days[di].items[ii];
      const label = it ? (it.type==='cardio' ? it.equipment : it.exercise) : '';
      state.tplRemoveConfirm = { dayIndex:di, itemIndex:ii, label };
      renderModal();
    });
  });

  if(b.addForm && b.addForm.type==='muscle'){
    const af = b.addForm;
    const groupSel = document.getElementById('tpl-af-group');
    if(groupSel) groupSel.addEventListener('change', ()=>{ af.groupLabel = groupSel.value; af.exercise=''; renderTplFormArea(); });
    const exSel = document.getElementById('tpl-af-exercise');
    if(exSel) exSel.addEventListener('change', ()=>{ af.exercise = exSel.value; renderTplFormArea(); });
    const customEx = document.getElementById('tpl-af-customex');
    if(customEx) customEx.addEventListener('input', ()=>{ af.customExercise = customEx.value; });
    document.querySelectorAll('[data-tpl-af-set]').forEach(el=>el.addEventListener('click', ()=>{ af.set=parseInt(el.getAttribute('data-tpl-af-set')); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-rep]').forEach(el=>el.addEventListener('click', ()=>{ af.rep=el.getAttribute('data-tpl-af-rep'); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-rest]').forEach(el=>el.addEventListener('click', ()=>{ af.rest=el.getAttribute('data-tpl-af-rest'); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-tempo]').forEach(el=>el.addEventListener('click', ()=>{ af.tempo=el.getAttribute('data-tpl-af-tempo'); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-failure]').forEach(el=>el.addEventListener('click', ()=>{ af.failure=parseInt(el.getAttribute('data-tpl-af-failure')); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-eqcheck]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const eqIdx = parseInt(el.getAttribute('data-eqidx'));
        const eq = EQUIPMENT_BY_EXERCISE[af.exercise][eqIdx];
        if(el.checked){
          af.equipment.push(normalizeEquipmentItem(eq));
        } else {
          af.equipment = af.equipment.filter(e=>e.name!==eq.name);
        }
        renderTplFormArea();
      });
    });
    const submitBtn = document.getElementById('tpl-af-submit');
    if(submitBtn) submitBtn.addEventListener('click', ()=>{
      const exerciseName = af.exercise==='ΆΛΛΟ' ? af.customExercise.trim() : af.exercise;
      if(!exerciseName){ toast('Συμπλήρωσε το όνομα της άσκησης.'); return; }
      const newItem = {
        type:'muscle', groupLabel: af.groupLabel, exercise: exerciseName,
        set: af.set, rep: af.rep, rest: af.rest, tempo: af.tempo, failure: af.failure,
        equipment: af.equipment
      };
      if(af.editIndex!==null && af.editIndex!==undefined){
        b.days[af.dayIndex].items[af.editIndex] = newItem;
      } else {
        b.days[af.dayIndex].items.push(newItem);
      }
      b.addForm = null;
      renderTplFormArea();
    });
  }
  if(b.addForm && b.addForm.type==='cardio'){
    const af = b.addForm;
    const eqSel = document.getElementById('tpl-af-cequip');
    if(eqSel) eqSel.addEventListener('change', ()=>{ af.equipment = eqSel.value; renderTplFormArea(); });
    document.querySelectorAll('[data-tpl-af-cmode]').forEach(el=>el.addEventListener('click', ()=>{ af.mode=el.getAttribute('data-tpl-af-cmode'); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-cintensity]').forEach(el=>el.addEventListener('click', ()=>{ af.intensity=el.getAttribute('data-tpl-af-cintensity'); renderTplFormArea(); }));
    document.querySelectorAll('[data-tpl-af-cminutes]').forEach(el=>el.addEventListener('click', ()=>{ af.minutes=el.getAttribute('data-tpl-af-cminutes'); renderTplFormArea(); }));
    const sl = document.getElementById('tpl-af-cspeedlow'); if(sl) sl.addEventListener('input', ()=>{ af.speedLow = sl.value; });
    const sh = document.getElementById('tpl-af-cspeedhigh'); if(sh) sh.addEventListener('input', ()=>{ af.speedHigh = sh.value; });
    const inc = document.getElementById('tpl-af-cincline'); if(inc) inc.addEventListener('input', ()=>{ af.incline = inc.value; });
    const dre = document.getElementById('tpl-af-cdrillevery'); if(dre) dre.addEventListener('input', ()=>{ af.drillEveryMinutes = dre.value; });
    const csubmit = document.getElementById('tpl-af-csubmit');
    if(csubmit) csubmit.addEventListener('click', ()=>{
      const newItem = {
        type:'cardio', equipment: af.equipment, mode: af.mode, speedLow: af.speedLow, speedHigh: af.speedHigh,
        incline: af.incline, intensity: af.intensity, minutes: af.minutes, drillEveryMinutes: af.drillEveryMinutes
      };
      if(af.editIndex!==null && af.editIndex!==undefined){
        b.days[af.dayIndex].items[af.editIndex] = newItem;
      } else {
        b.days[af.dayIndex].items.push(newItem);
      }
      b.addForm = null;
      renderTplFormArea();
    });
  }

  const saveBtn = document.getElementById('tpl-save-btn');
  if(saveBtn) saveBtn.addEventListener('click', submitTplProgram);
  const cancelEditBtn = document.getElementById('tpl-cancel-edit');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{
    state.tplBuilder = freshTplBuilder();
    renderTplFormArea();
  });
}

async function submitTplProgram(){
  const b = state.tplBuilder;
  const needsSub = (TPL_CATEGORIES[b.topCategory]||[]).length>0;
  if(!b.topCategory.trim() || !b.name.trim() || (needsSub && !b.subCategory.trim())){
    toast('Συμπλήρωσε τουλάχιστον Κατηγορία' + (needsSub?', Υποκατηγορία':'') + ' και Ονομασία προγράμματος.');
    return;
  }
  const totalItems = b.days.reduce((sum,d)=>sum+d.items.length,0);
  if(totalItems===0){
    toast('Πρόσθεσε τουλάχιστον μία άσκηση σε κάποια ημέρα.');
    return;
  }
  const btn = document.getElementById('tpl-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Αποθήκευση...'; }
  const row = {
    gender: b.gender,
    top_category: b.topCategory.trim(),
    top_category_photo_url: b.topCategoryPhoto.trim() || null,
    sub_category: b.subCategory.trim() || null,
    name: b.name.trim(),
    photo_url: b.photo.trim() || null,
    num_days: b.numDays,
    description: b.description.trim() || null,
    results: b.results.trim() || null,
    nutrition: b.nutrition.trim() || null,
    notes: b.notes.trim() || null,
    sort_order: b.sortOrder || 0,
    is_published: !!b.isPublished,
    data: { days: b.days }
  };
  let ok;
  if(b.id){
    row.updated_by = auth.user.id;
    row.updated_by_email = auth.email;
    row.updated_at = new Date().toISOString();
    ok = await updateTemplateProgram(b.id, row);
  } else {
    row.created_by = auth.user.id;
    row.created_by_email = auth.email;
    ok = await saveTemplateProgram(row);
  }
  const wasEdit = !!b.id;
  if(btn){ btn.disabled=false; btn.innerHTML = ICON.save+(wasEdit?'Αποθήκευση Αλλαγών':'Αποθήκευση Προγράμματος στη Βιβλιοθήκη'); }
  if(ok){
    toast(wasEdit ? 'Οι αλλαγές αποθηκεύτηκαν!' : 'Το πρόγραμμα αποθηκεύτηκε στη βιβλιοθήκη!');
    state.tplBuilder = freshTplBuilder();
    renderTplFormArea();
    state.tplTemplates = await loadTemplatePrograms();
    renderTplListArea();
  } else {
    toast('Σφάλμα αποθήκευσης. Δοκίμασε ξανά.');
  }
}

function renderTplListArea(){
  const area = document.getElementById('tpl-list-area');
  if(!area) return;
  const list = state.tplTemplates;
  area.innerHTML = `
    <div class="section-title"><span class="dot"></span>Αποθηκευμένα Έτοιμα Προγράμματα (${list.length})</div>
    ${list.length===0 ? `<div class="empty" style="padding:20px 0;"><p>Δεν έχεις αποθηκεύσει ακόμα κάποιο πρόγραμμα.</p></div>` :
      list.map(t=>`
        <div class="tl-card" style="margin-bottom:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div>
            <div style="font-size:11px;color:var(--cyan-soft);text-transform:uppercase;letter-spacing:0.05em;">${escHtml(t.gender)} · ${escHtml(t.top_category)}${t.sub_category?' · '+escHtml(t.sub_category):''}</div>
            <div style="font-weight:700;font-size:14px;color:#dffaff;margin-top:2px;">${escHtml(t.name)}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${t.num_days} ημέρες · σειρά ${t.sort_order||0} · ${t.is_published ? `<span style="color:#7ef5a0;">ορατό στους πελάτες</span>` : `<span style="color:#ffcf9e;">μόνο στη βιβλιοθήκη</span>`}</div>
            <div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">Δημιουργός: ${escHtml(t.created_by_email||'—')}${t.updated_by_email?` · Τελευταία επεξεργασία: ${escHtml(t.updated_by_email)}`:''}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-info" style="padding:6px 10px;font-size:11px;" data-tpl-edit="${escAttr(t.id)}">Επεξεργασία</button>
            <button class="btn btn-outline" style="padding:6px 10px;font-size:11px;" data-tpl-togglepub="${escAttr(t.id)}">${t.is_published?'Απόκρυψη':'Δημοσίευση'}</button>
            <button class="btn btn-outline" style="padding:6px 10px;font-size:11px;" data-tpl-delete="${escAttr(t.id)}">Διαγραφή</button>
          </div>
        </div>
      `).join('')
    }`;
  document.querySelectorAll('[data-tpl-edit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-tpl-edit');
      const t = state.tplTemplates.find(x=>x.id===id);
      if(t) loadTemplateIntoBuilder(t);
    });
  });
  document.querySelectorAll('[data-tpl-togglepub]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-tpl-togglepub');
      const t = state.tplTemplates.find(x=>x.id===id);
      if(!t) return;
      el.disabled = true;
      const ok = await updateTemplatePublish(id, !t.is_published);
      el.disabled = false;
      if(ok){ t.is_published = !t.is_published; renderTplListArea(); toast(t.is_published?'Το πρόγραμμα είναι πλέον ορατό στους πελάτες.':'Το πρόγραμμα κρύφτηκε από τους πελάτες.'); }
      else toast('Σφάλμα ενημέρωσης.');
    });
  });
  document.querySelectorAll('[data-tpl-delete]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Σίγουρα θέλεις να διαγράψεις αυτό το πρόγραμμα από τη βιβλιοθήκη;')) return;
      const id = el.getAttribute('data-tpl-delete');
      const ok = await deleteTemplateProgram(id);
      if(ok){ state.tplTemplates = state.tplTemplates.filter(x=>x.id!==id); renderTplListArea(); toast('Διαγράφηκε.'); }
      else toast('Σφάλμα διαγραφής.');
    });
  });
}

let toastTimer=null;
function toast(msg, duration){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), duration||2600);
}
let setLoggedBannerTimer = null;
function showSetLoggedBanner(msg){
  const el = document.getElementById('set-logged-banner');
  const textEl = document.getElementById('set-logged-banner-text');
  if(!el || !textEl) return;
  textEl.textContent = msg;
  el.style.display = 'block';
  clearTimeout(setLoggedBannerTimer);
  setLoggedBannerTimer = setTimeout(()=>{ el.style.display = 'none'; }, 6000);
}
document.getElementById('set-logged-banner-close')?.addEventListener('click', ()=>{
  const el = document.getElementById('set-logged-banner');
  if(el) el.style.display = 'none';
  clearTimeout(setLoggedBannerTimer);
});

function renderAuthScreens(){
  const root = document.getElementById('auth-root');
  let html = '';
  if(auth.status === 'loading'){
    html = authShell(`<div class="auth-loading" style="padding:20px 0;"><div class="spinner"></div><div>Φόρτωση...</div></div>`);
  } else if(auth.status === 'signedOut'){
    if(!auth.roleChoice) html = authShell(renderRoleChoice());
    else if(auth.roleChoice === 'trainer') html = authShell(renderTrainerAuthForm());
    else html = authShell(renderClientAuthForm());
  } else if(auth.status === 'client-needs-code'){
    html = authShell(renderClaimCodeForm());
  }
  root.innerHTML = html;
  bindAuthEvents();
}
function bindAuthEvents(){
  document.querySelectorAll('[data-role]').forEach(el=>{
    el.addEventListener('click', ()=>{ auth.roleChoice = el.getAttribute('data-role'); auth.authTab='login'; auth.authError=''; renderAuthScreens(); });
  });
  const back = document.querySelector('[data-back]');
  if(back) back.addEventListener('click', ()=>{ auth.roleChoice=null; auth.authError=''; renderAuthScreens(); });

  const trainerBtn = document.getElementById('trainer-auth-btn');
  if(trainerBtn) trainerBtn.addEventListener('click', ()=>{
    const email = document.getElementById('t-email').value.trim();
    const pw = document.getElementById('t-password').value;
    if(!email||!pw){ auth.authError='Συμπλήρωσε email και κωδικό.'; renderAuthScreens(); return; }
    if(auth.authTab==='login'){
      doTrainerLogin(email, pw);
    } else {
      const invite = document.getElementById('t-invite').value.trim();
      if(!invite){ auth.authError='Χρειάζεσαι κωδικό πρόσκλησης από υπάρχοντα προπονητή.'; renderAuthScreens(); return; }
      if(pw.length<6){ auth.authError='Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.'; renderAuthScreens(); return; }
      doTrainerSignup(email, pw, invite);
    }
  });

  document.querySelectorAll('[data-authtab]').forEach(el=>{
    el.addEventListener('click', ()=>{ auth.authTab = el.getAttribute('data-authtab'); auth.authError=''; renderAuthScreens(); });
  });
  const clientBtn = document.getElementById('client-auth-btn');
  if(clientBtn) clientBtn.addEventListener('click', ()=>{
    const email = document.getElementById('c-email').value.trim();
    const pw = document.getElementById('c-password').value;
    if(!email||!pw){ auth.authError='Συμπλήρωσε email και κωδικό.'; renderAuthScreens(); return; }
    if(pw.length<6){ auth.authError='Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.'; renderAuthScreens(); return; }
    if(auth.authTab==='login') doClientLogin(email, pw); else doClientSignup(email, pw);
  });

  const claimBtn = document.getElementById('claim-btn');
  if(claimBtn) claimBtn.addEventListener('click', ()=>{
    const code = document.getElementById('claim-code').value.trim();
    if(!code){ auth.authError='Πληκτρολόγησε τον κωδικό σου.'; renderAuthScreens(); return; }
    doClaimCode(code);
  });
  const claimLogout = document.getElementById('claim-logout');
  if(claimLogout) claimLogout.addEventListener('click', doLogout);

  document.querySelectorAll('#auth-root input').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        const btn = document.getElementById('trainer-auth-btn') || document.getElementById('client-auth-btn') || document.getElementById('claim-btn');
        if(btn) btn.click();
      }
    });
  });
}

/* ===================================================================
   BUILDER — κοινές βοηθητικές συναρτήσεις (βάρη)
   =================================================================== */
function isRowFilled(row){
  if(!row.selected) return false;
  if(row.selected === 'ΆΛΛΟ') return row.customText.trim().length>0;
  return true;
}
function rowExerciseName(row){
  if(row.selected === 'ΆΛΛΟ') return row.customText.trim();
  return row.selected;
}
function rowSetRepRest(row){
  if(row.fixedSetRep) return row.fixedSetRep;
  return { set: row.set, rep: SETREP[row.set].rep, rest: SETREP[row.set].rest };
}
function getFilteredDaysGeneric(days){
  return days.map(day=>({
    label: day.label,
    groups: day.groups.filter(isRowFilled).map(row=>{
      const sr = rowSetRepRest(row);
      return { groupLabel: row.groupLabel, exercise: rowExerciseName(row), set: sr.set, rep: sr.rep, rest: sr.rest, failure: row.failure, equipment: row.equipment||[] };
    })
  })).filter(d=>d.groups.length>0);
}
function getFilteredDays(){ return getFilteredDaysGeneric(state.days); }

/* ===================================================================
   BUILDER — κοινές βοηθητικές συναρτήσεις (αερόβιο)
   =================================================================== */
function isCardioSlotFilled(slot){ return !!slot.equipment; }
function describeCardioSlot(slot){
  const isTreadmill = slot.equipment === 'Διάδρομος';
  const lines = [];
  if(isTreadmill){
    lines.push(slot.mode==='drill' ? 'Αεροβική άσκηση με DRILL' : 'Σταθερή ταχύτητα');
    if(slot.speedLow) lines.push('Ταχύτητα μικρή: '+slot.speedLow+' km/h');
    if(slot.speedHigh) lines.push('Ταχύτητα μεγάλη: '+slot.speedHigh+' km/h');
    if(slot.incline) lines.push('Κλίση: '+slot.incline+'%');
    if(slot.mode==='drill' && slot.drillEveryMinutes) lines.push('Χρόνος μεταξύ DRILL: '+slot.drillEveryMinutes+' λεπτά');
  } else {
    if(slot.intensity) lines.push(slot.intensity);
  }
  if(slot.minutes) lines.push(slot.minutes+' λεπτά');
  return {
    ...slot, // διατηρούμε όλα τα αρχικά αριθμητικά πεδία (mode, speedLow, speedHigh, incline, minutes, drillEveryMinutes) ώστε να είναι διαθέσιμα αργότερα για το γράφημα έντασης
    equipment: slot.equipment,
    lines,
    instruction: isTreadmill ? (slot.mode==='drill' ? TREADMILL_DRILL_TEXT : TREADMILL_STEADY_TEXT) : ''
  };
}
function getFilteredCardioSlots(slots){
  return slots.filter(isCardioSlotFilled).map(describeCardioSlot);
}

/* ===================================================================
   BUILDER — assembling το τρέχον πρόγραμμα σε ενιαία μορφή για
   preview / εκτύπωση / PDF / αποθήκευση
   =================================================================== */
function buildCurrentProgramRecord(){
  const record = {
    category: state.category,
    subtype: state.fatburnSubtype,
    notes: state.notes,
    instructions: state.instructions,
    nutrition: null,
    days: null,
    cardioSlots: null
  };
  if(state.category === 'muscle'){
    record.nutrition = { setChoice: state.nutritionSet, kcal: NUTRITION_INFO[state.nutritionSet].kcal, text: NUTRITION_INFO[state.nutritionSet].text };
    record.days = getFilteredDaysGeneric(state.days);
  } else if(state.category === 'fatburn'){
    record.nutrition = { kcal: fmtKcal(state.fatburnKcal), text: (state.fatburnSubtype==='cardio' ? FATBURN_NUTRITION_TEXT_CARDIO : FATBURN_NUTRITION_TEXT_WEIGHTS) };
    if(state.fatburnSubtype === 'weights'){
      record.days = getFilteredDaysGeneric(state.days);
    } else if(state.fatburnSubtype === 'cardio'){
      record.cardioSlots = getFilteredCardioSlots(state.cardioSlots);
    } else if(state.fatburnSubtype === 'combo'){
      record.days = state.days.map(day=>{
        const w = getFilteredDaysGeneric([day])[0];
        const c = getFilteredCardioSlots(day.cardioSlots);
        return { label: day.label, topSection: day.topSection, groups: w?w.groups:[], cardioSlots: c };
      }).filter(d=> d.groups.length>0 || d.cardioSlots.length>0);
    }
  }
  return record;
}
function isProgramRecordEmpty(record){
  if(record.days && record.days.length>0) return false;
  if(record.cardioSlots && record.cardioSlots.length>0) return false;
  return true;
}

function renderDayCard(day, idx){
  const weightsBlock = `
    <div class="panel day-card">
      <div class="day-head">

function renderPreview(){

function bindBuilderEvents(){
  document.querySelectorAll('[data-category]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.category = el.getAttribute('data-category');
      state.fatburnSubtype = null;
      resetProgramState();
      if(state.category==='muscle') initProgramForSelection();
      render();
    });
  });
  const backCat = document.querySelector('[data-back-category]');
  if(backCat) backCat.addEventListener('click', ()=>{ state.category=null; state.fatburnSubtype=null; resetProgramState(); render(); });
  document.querySelectorAll('[data-subtype]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.fatburnSubtype = el.getAttribute('data-subtype');
      resetProgramState();
      initProgramForSelection();
      render();
    });
  });
  const backSub = document.querySelector('[data-back-subtype]');
  if(backSub) backSub.addEventListener('click', ()=>{
    if(state.category==='fatburn'){ state.fatburnSubtype=null; resetProgramState(); }
    else { state.category=null; resetProgramState(); }
    render();
  });

  document.querySelectorAll('[data-days]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const n = parseInt(el.getAttribute('data-days'));
      state.numDays = n;
      const fixed = state.category==='muscle' ? null : (state.fatburnSubtype==='weights' ? FATBURN_WEIGHTS_FIXED : COMBO_WEIGHTS_FIXED);
      const newDays = buildDays(n, fixed);
      newDays.forEach((day, di)=>{
        const oldDay = state.days[di];
        if(!oldDay) return;
        day.groups.forEach(row=>{
          const oldRow = oldDay.groups.find(r=>r.id===row.id);
          if(oldRow){ row.selected=oldRow.selected; row.customText=oldRow.customText; row.set=oldRow.set; }
        });
        if(oldDay.cardioSlots) day.cardioSlots = oldDay.cardioSlots;
        if(oldDay.topSection) day.topSection = oldDay.topSection;
      });
      state.days = newDays;
      render();
    });
  });
  document.querySelectorAll('[data-exsel]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const di = parseInt(el.getAttribute('data-day'));
      const rid = el.getAttribute('data-row');
      const row = state.days[di].groups.find(r=>r.id===rid);
      row.selected = el.value;
      if(row.selected !== 'ΆΛΛΟ') row.customText='';
      row.equipment = [];
      render();
    });
  });
  document.querySelectorAll('[data-customtext]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const di = parseInt(el.getAttribute('data-day'));
      const rid = el.getAttribute('data-row');
      const row = state.days[di].groups.find(r=>r.id===rid);
      row.customText = el.value;
      render(true);
    });
  });
  document.querySelectorAll('[data-setbtn]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const di = parseInt(el.getAttribute('data-day'));
      const rid = el.getAttribute('data-row');
      const s = parseInt(el.getAttribute('data-set'));
      const row = state.days[di].groups.find(r=>r.id===rid);
      row.set = s;
      render();
    });
  });
  document.querySelectorAll('[data-failure-btn]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const di = parseInt(el.getAttribute('data-day'));
      const rid = el.getAttribute('data-row');
      const f = parseInt(el.getAttribute('data-failure'));
      const row = state.days[di].groups.find(r=>r.id===rid);
      row.failure = f;
      render();
    });
  });
  document.querySelectorAll('[data-equip-check]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const di = parseInt(el.getAttribute('data-day'));
      const rid = el.getAttribute('data-row');
      const eqIdx = parseInt(el.getAttribute('data-eqidx'));
      const row = state.days[di].groups.find(r=>r.id===rid);
      const eq = EQUIPMENT_BY_EXERCISE[row.selected][eqIdx];
      if(el.checked){
        row.equipment.push(normalizeEquipmentItem(eq));
      } else {
        row.equipment = row.equipment.filter(e=>e.name!==eq.name);
      }
      render(true);
    });
  });
  document.querySelector('[data-gym-select]')?.addEventListener('change', (e)=>{
    state.selectedGym = e.target.value || null;
    render();
  });
  document.querySelectorAll('[data-nutrition-set]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const newSet = parseInt(el.getAttribute('data-nutrition-set'));
      state.nutritionSet = newSet;
      // Εφαρμόζει τον νέο αριθμό σετ σε όλες τις ασκήσεις του προγράμματος —
      // ο γυμναστής μπορεί μετά να τις αλλάξει μία-μία χειροκίνητα αν θέλει.
      (state.days||[]).forEach(day=>{
        (day.groups||[]).forEach(row=>{ if(!row.fixedSetRep) row.set = newSet; });
      });
      if(newSet === 6){
        toast('Η επιλογή αυτή είναι για πολύ προχωρημένους αθλητές με πολύ καλή διατροφή και συμπληρώματα.', 4500);
      }
      render();
    });
  });
  document.querySelectorAll('[data-fatburn-kcal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.fatburnKcal = parseInt(el.getAttribute('data-fatburn-kcal'));
      render();
    });
  });

  // Cardio slot bindings — resolve target slot array by day (or flat)
  function cardioSlotsFor(dayAttr){
    return dayAttr==='flat' ? state.cardioSlots : state.days[parseInt(dayAttr)].cardioSlots;
  }
  document.querySelectorAll('[data-cardio-eq]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      const slot = slots[parseInt(el.getAttribute('data-cidx'))];
      slot.equipment = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-cardio-mode]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].mode = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-cardio-speedlow]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].speedLow = el.value;
      render(true);
    });
  });
  document.querySelectorAll('[data-cardio-speedhigh]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].speedHigh = el.value;
      render(true);
    });
  });
  document.querySelectorAll('[data-cardio-incline]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].incline = el.value;
      render(true);
    });
  });
  document.querySelectorAll('[data-cardio-drillevery]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].drillEveryMinutes = el.value;
      render(true);
    });
  });
  document.querySelectorAll('[data-cardio-intensity]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].intensity = el.value;
      render();
    });
  });
  document.querySelectorAll('[data-cardio-minutes]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const slots = cardioSlotsFor(el.getAttribute('data-cday'));
      slots[parseInt(el.getAttribute('data-cidx'))].minutes = el.value;
      render();
    });
  });

  const fInstr = document.getElementById('f-instructions');
  if(fInstr) fInstr.addEventListener('input', ()=>{ state.instructions = fInstr.value; });
  const fNotes = document.getElementById('f-notes');
  if(fNotes) fNotes.addEventListener('input', ()=>{ state.notes = fNotes.value; });

  const btnPdf = document.getElementById('btn-pdf');
  const btnPrint = document.getElementById('btn-print');
  const btnSave = document.getElementById('btn-save');
  if(btnPdf) btnPdf.addEventListener('click', exportPdf);
  if(btnPrint) btnPrint.addEventListener('click', printProgram);
  if(btnSave) btnSave.addEventListener('click', handleSaveButtonClick);
}

function renderPreviewOnly(){
  const wrap = document.querySelector('.preview-wrap');
  if(wrap){ wrap.innerHTML = renderPreview(); bindPreviewButtons(); }
}
function bindPreviewButtons(){
  const btnPdf = document.getElementById('btn-pdf');
  const btnPrint = document.getElementById('btn-print');
  const btnSave = document.getElementById('btn-save');
  if(btnPdf) btnPdf.addEventListener('click', exportPdf);
  if(btnPrint) btnPrint.addEventListener('click', printProgram);
  if(btnSave) btnSave.addEventListener('click', handleSaveButtonClick);
}
async function handleSaveButtonClick(){
  if(state.editingProgramId){
    await confirmDirectUpdate();
  } else {
    state.saveModalOpen=true; renderModal();
    if(!state.customersLoaded) await loadCustomers();
  }
}
async function confirmDirectUpdate(){
  const record = buildCurrentProgramRecord();
  if(isProgramRecordEmpty(record)){
    toast('Δεν υπάρχουν ασκήσεις στο πρόγραμμα.');
    return;
  }
  record.createdByEmail = state.editingOriginalCreator || auth.email || '';
  record.modifiedByEmail = auth.email || '';
  record.modifiedAt = new Date().toISOString();
  const btn = document.getElementById('btn-save');
  if(btn){ btn.disabled = true; btn.textContent = 'Αποθήκευση...'; }
  const ok = await updateProgram(state.editingProgramId, record);
  if(btn){ btn.disabled = false; btn.innerHTML = ICON.save+'Αποθήκευση Διόρθωσης'; }
  if(ok){
    toast('Η διόρθωση αποθηκεύτηκε.');
    state.editingProgramId = null;
    state.editingOriginalCreator = '';
    state.customersLoaded = false;
    render();
  } else {
    toast('Σφάλμα αποθήκευσης. Δοκίμασε ξανά.');
  }
}

      ${slots.filter(s=>s.instruction).map(s=>`<p style="font-size:10.5px;color:#3A3F45;line-height:1.5;margin:6px 0 0;">${escHtml(s.instruction)}</p>`).join('')}

function buildPrintHtml(record, client){
  const dateStr = new Date().toLocaleDateString('el-GR');
  const categoryLabel = record.category==='muscle' ? CATEGORY_INFO.muscle.title : (record.subtype ? FATBURN_SUBTYPES[record.subtype].title : CATEGORY_INFO.fatburn.title);

  let topInfo = '';
  if(record.nutrition){
    topInfo += `
      <div class="pp-day">
        <h3>Διατροφή</h3>
        <p style="font-size:11.5px;font-weight:700;margin:0 0 6px;">${escHtml(record.nutrition.kcal)}</p>
        <p style="font-size:10.5px;color:#3A3F45;line-height:1.5;margin:0 0 8px;">${escHtml(record.nutrition.text)}</p>
        <p style="font-size:10.5px;color:#3A3F45;line-height:1.5;margin:0;font-style:italic;">${escHtml(NUTRITION_BOX_TEXT)}</p>
      </div>`;
  }
  if(record.instructions){
    topInfo += `<div class="pp-day"><h3>Οδηγίες</h3><p style="font-size:11px;line-height:1.5;margin:0;">${escHtml(record.instructions)}</p></div>`;
  }
  if(record.notes){
    topInfo += `<div class="pp-day"><h3>Παρατηρήσεις</h3><p style="font-size:11px;line-height:1.5;margin:0;">${escHtml(record.notes)}</p></div>`;
  }
  const hasFailureExercises = record.category==='muscle' || record.subtype==='weights' ||
    (record.subtype==='combo' && (record.days||[]).some(d=>d.groups && d.groups.length>0));
  if(hasFailureExercises){
    topInfo += `<div class="pp-day"><h3>Τι σημαίνει η Ένταση (UNTIL FAILURE)</h3><p style="font-size:10.5px;color:#3A3F45;line-height:1.5;margin:0;">${escHtml(FAILURE_EXPLANATION)}</p></div>`;
  }

  let body = '';
  if(record.subtype === 'cardio'){

/* Ραστεροποιεί το πραγματικό στυλιζαρισμένο HTML (με σωστά ελληνικά, πραγματικές
   γραμματοσειρές) σε canvas και το τοποθετεί σελίδα-σελίδα μέσα σε PDF.
   Αυτό αποφεύγει το πρόβλημα των jsPDF ενσωματωμένων γραμματοσειρών που δεν
   υποστηρίζουν ελληνικούς χαρακτήρες (εμφανίζονταν ως σύμβολα/κουτάκια). */
function withTimeout(promise, ms, msg){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(msg||'timeout')), ms))
  ]);
}

async function generatePdfFromRecord(record, client){
  if(!record || isProgramRecordEmpty(record)){ toast('Δεν υπάρχουν ασκήσεις για εξαγωγή PDF ακόμα.'); return; }
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    toast('Δεν φορτώθηκαν οι βιβλιοθήκες PDF. Έλεγξε τη σύνδεση στο διαδίκτυο και δοκίμασε ξανά.');
    return;
  }
  const wrap = document.getElementById('pdf-capture-wrap');
  // Σκόπιμα χρησιμοποιούμε σταθερή γραμματοσειρά συστήματος (όχι Google Font) εδώ,
  // ώστε η λήψη του PDF να μην εξαρτάται από εξωτερική φόρτωση γραμματοσειράς
  // (πλήρης υποστήριξη ελληνικών, καμία εξάρτηση δικτύου).
  wrap.innerHTML = `<div style="padding:36px;font-family:Arial, Helvetica, sans-serif;color:#14171A;">${buildPrintHtml(record, client)}</div>`;
  toast('Δημιουργία PDF...');
  try{
    await new Promise(r=>setTimeout(r, 60)); // ensure layout settled

    const canvas = await withTimeout(
      html2canvas(wrap, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        allowTaint: true,
        imageTimeout: 6000,
        windowWidth: 800
      }),
      15000,
      'Η δημιουργία εικόνας άργησε πολύ.'
    );

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.95);

    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    pdf.save('programma-gymnastikis.pdf');
    toast('Το PDF κατέβηκε επιτυχώς.');
  }catch(e){
    console.error(e);
    toast('Σφάλμα κατά τη δημιουργία PDF.');
  }finally{
    wrap.innerHTML = '';
  }
}

function exportPdf(){
  generatePdfFromRecord(buildCurrentProgramRecord(), null);
}

function parseRepRangeStr(repStr){
  const numbers = String(repStr||'').match(/\d+(?:[.,]\d+)?/g) || [];
  const min = Math.max(1, Number(String(numbers[0]||8).replace(',','.')));
  const max = Math.max(min, Number(String(numbers[1]||numbers[0]||10).replace(',','.')));
  return { min, max };
}

function updateWorkoutTimerUI(){
  const numberEl=document.getElementById('timerNumber');
  const ringEl=document.getElementById('timerRing');
  if(numberEl){ numberEl.textContent=timerState.remaining; numberEl.classList.remove('warning','finished'); }
  if(ringEl){
    const progress = timerState.max>0 ? Math.max(0,(timerState.remaining/timerState.max)*100) : 0;
    ringEl.style.setProperty('--progress', progress);
    ringEl.classList.remove('warning','finished');
  }
  if(timerState.remaining===0){ numberEl?.classList.add('finished'); ringEl?.classList.add('finished'); }
  else if(timerState.remaining<=10){ numberEl?.classList.add('warning'); ringEl?.classList.add('warning'); }
  const setBox=document.getElementById('setBox');
  if(setBox){
    const sc = getSetBoxContent();
    setBox.innerHTML = sc.html;
    setBox.classList.toggle('completed-blink', sc.cls==='completed-blink');

  const statusEl=document.getElementById('timerStatus');
  if(statusEl){
    if(timerState.running) statusEl.textContent='Η αντίστροφη μέτρηση εκτελείται.';
    else if(timerState.paused) statusEl.textContent='Παύση. Το START συνεχίζει από εκεί που έμεινε.';
    else if(timerState.remaining===0) statusEl.textContent='Το διάλειμμα ολοκληρώθηκε.';
    else statusEl.textContent = `Χρόνος διαλείμματος: ${timerState.max} sec`;
  }
}
function startWorkoutTimer(){
  if(timerState.running) return;
  if(timerState.remaining===0){
    if(timerState.nextSet>timerState.totalSets){
      const s=document.getElementById('timerStatus'); if(s) s.textContent='Η άσκηση ολοκληρώθηκε. Πάτησε ΕΠΑΝΑΦΟΡΑ για νέο κύκλο.';
      return;
    }
    timerState.remaining=timerState.max; timerState.paused=false;
  }
  if(timerState.remaining===timerState.max && !timerState.paused){
    if(timerState.skipNextAdvance){
      timerState.skipNextAdvance = false;
    } else if(timerState.lastAdvanceSource === 'calc'){
      timerState.lastAdvanceSource = null;
    } else {
      timerState.nextSet+=1;
      timerState.lastAdvanceSource = 'timer';
    }
  }
  timerState.running=true; timerState.paused=false;
  updateWorkoutTimerUI();
  startTimerDecimalTicker();
  timerState.interval=setInterval(()=>{
    timerState.remaining-=1;
    pulseTimerRingGlow();
    if(timerState.remaining<=0){
      timerState.remaining=0;
      clearInterval(timerState.interval); timerState.interval=null;
      timerState.running=false; timerState.paused=false;
      stopTimerDecimalTicker();
      if(navigator.vibrate) navigator.vibrate([180,100,180]);
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator(); const gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value=880;
        gain.gain.setValueAtTime(.14,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+0.75);
        osc.start(); osc.stop(ctx.currentTime+0.8);
      }catch(e){}
    }
    updateWorkoutTimerUI();
  },1000);
}

function roundToStepW(n,step){ return Math.round(n/step)*step; }
function formatCalcNum(n){
  const v = Math.round((Number(n)+Number.EPSILON)*10)/10;
  return Number.isInteger(v)?String(v):String(v).replace('.',',');
}
const ORDINAL_GR = {1:'πρώτο',2:'δεύτερο',3:'τρίτο',4:'τέταρτο',5:'πέμπτο',6:'έκτο',7:'έβδομο',8:'όγδοο',9:'ένατο',10:'δέκατο'};
function ordinalGr(n){ return ORDINAL_GR[n] || `${n}ο`; }
function ordinalEn(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function parseCalcNumber(str){
  return Number(String(str).replace(',', '.'));
}
function calculateWorkoutNextWeight(){
  if(!workoutCalcValues.reps || !workoutCalcValues.kg){ state.repsKgRequiredModalOpen = true; renderModal(); return; }
  const reps0 = Number(workoutCalcValues.reps);
  const kg0 = parseCalcNumber(workoutCalcValues.kg);
  if(!Number.isFinite(reps0)||!Number.isFinite(kg0)||reps0<=0||kg0<=0){ showWorkoutCalcError('Οι τιμές πρέπει να είναι μεγαλύτερες από το μηδέν.'); return; }
  if(!workoutFailureQuality){ state.fqRequiredModalOpen = true; renderModal(); return; }

  const btn = document.getElementById('calcComputeBtn');
  const nw=document.getElementById('nextWeight');
  const cr=document.getElementById('changeResult');

  const cm=document.getElementById('calcMessage');

  if(btn) btn.disabled = true;

  setTimeout(()=>{

  }, 850);
}
function performWorkoutCalculation(){
  const ex = state.workoutExercise;
  const range = parseRepRangeStr(ex.rep);
  const reps = Number(workoutCalcValues.reps);
  const kg = parseCalcNumber(workoutCalcValues.kg);
  if(!workoutCalcValues.reps || !workoutCalcValues.kg){ showWorkoutCalcError('Συμπλήρωσε πρώτα τις επαναλήψεις και τα κιλά.'); return; }
  if(!Number.isFinite(reps)||!Number.isFinite(kg)||reps<=0||kg<=0){ showWorkoutCalcError('Οι τιμές πρέπει να είναι μεγαλύτερες από το μηδέν.'); return; }

  let weightPercent=0, repsPercent=0, explanation='';
  if(reps>=range.min && reps<=range.max){
    weightPercent=0;
    explanation=`Οι ${reps} επαναλήψεις είναι μέσα στον στόχο ${range.min}–${range.max}. Τα κιλά μένουν ίδια.`;
  } else if(reps>range.max){
    repsPercent = ((reps-range.max)/range.max)*100;
    weightPercent = repsPercent<=60 ? repsPercent : 60+(repsPercent-60)*0.5;
    weightPercent = Math.min(weightPercent,230);
    explanation = `Οι επαναλήψεις είναι ${formatCalcNum(repsPercent)}% περισσότερες από το ανώτατο όριο ${range.max}.`;
  } else {
    repsPercent = ((range.min-reps)/range.min)*100;
    weightPercent = -Math.min(repsPercent,90);
    explanation = `Οι επαναλήψεις είναι ${formatCalcNum(repsPercent)}% λιγότερες από το κατώτατο όριο ${range.min}.`;
  }
  const primaryEq = (ex.equipment && ex.equipment[0]) || null;
  const calcType = CALC_TYPES[(primaryEq && primaryEq.calcType) || DEFAULT_CALC_TYPE];
  const roundingStep = calcType.roundingStep;
  const rawNext = kg*(1+weightPercent/100);
  const nextWeight = Math.max(0, roundToStepW(rawNext, roundingStep));
  const change = nextWeight-kg;

  const nw=document.getElementById('nextWeight'); if(nw) nw.innerHTML = `${formatCalcNum(nextWeight)} KG`;
  const cb=document.getElementById('changeBox');
  const cr=document.getElementById('changeResult');
  if(cb) cb.classList.remove('positive','negative');
  if(cr){
    cr.classList.remove('positive','negative');
    if(change>0){ cr.textContent=`+${formatCalcNum(change)} KG`; cr.classList.add('positive'); cb?.classList.add('positive'); }
    else if(change<0){ cr.textContent=`${formatCalcNum(change)} KG`; cr.classList.add('negative'); cb?.classList.add('negative'); }
    else cr.textContent='0 KG';
  }
  const cm=document.getElementById('calcMessage');
  if(cm){ cm.classList.remove('error'); cm.textContent = explanation+` Υπολογισμένη μεταβολή: ${weightPercent>=0?'+':''}${formatCalcNum(weightPercent)}%. Στρογγυλοποίηση ανά ${formatCalcNum(roundingStep)} kg.`; }

  const logCtx = state.workoutLogContext;
  if(logCtx && logCtx.customerCode){
    const setNumber = timerState.nextSet||1;
    const fq = FAILURE_QUALITY_OPTIONS.find(f=>f.key===workoutFailureQuality) || FAILURE_QUALITY_OPTIONS[0];
    const wv = kg * reps;
    const awv = wv * (fq.pct/100);
    logWorkoutSet({
      customer_code: logCtx.customerCode,
      program_name: logCtx.programName || null,
      exercise: ex.exercise,
      group_label: toBilingualGroupLabel(ex.groupLabel) || null,
      set_number: setNumber,
      reps: reps,
      kg: kg,
      calc_type: calcType.key,
      equipment_name: primaryEq ? primaryEq.name : null,
      wv: wv,
      awv: awv,
      failure_quality: fq.key,
      failure_quality_pct: fq.pct,
      created_by: auth.user ? auth.user.id : null
    }).then(ok=>{
      if(ok) showSetLoggedBanner(`Το ${ordinalGr(setNumber)} σετ καταγράφηκε ✓ (AWV ${formatCalcNum(awv)} kg) / The ${ordinalEn(setNumber)} set was recorded (AWV ${formatCalcNum(awv)} kg)`);
      else toast('Σφάλμα καταγραφής σετ.');
    });
  } else {
    toast('Προεπισκόπηση — δεν καταγράφεται σε ημερολόγιο πελάτη.');
  }

  // Το "ΕΠΟΜΕΝΟ SET" προχωράει όποτε πατηθεί ο υπολογιστής κιλών — εκτός αν το
  // χρονόμετρο έχει ήδη προχωρήσει το set αυτό (ώστε να μην αυξάνεται διπλά).
  if(timerState.lastAdvanceSource === 'timer'){
    timerState.lastAdvanceSource = null;
  } else {
    timerState.nextSet+=1;
    timerState.lastAdvanceSource = 'calc';
  }
  updateWorkoutTimerUI();

  // Καθαρισμός reps/κιλών μετά τον υπολογισμό, ώστε ένα κατά λάθος διπλό
  // πάτημα του κουμπιού να μην καταγράφει ξανά το ίδιο σετ.
  // ΣΗΜΕΙΩΣΗ: δεν καλούμε εδώ updateWorkoutCalcDisplay(), γιατί αυτή καλεί
  // clearWorkoutCalcResults() που θα έσβηνε αμέσως το nextWeight/changeResult
  // που μόλις υπολογίσαμε παραπάνω. Ενημερώνουμε μόνο τα πεδία REPS/KG.
  workoutCalcValues = { reps:'', kg:'' };
  workoutCalcField = null;
  const repsValEl=document.getElementById('repsVal'); if(repsValEl) repsValEl.textContent = '0';
  const kgValEl=document.getElementById('kgVal'); if(kgValEl) kgValEl.textContent = '0';
  document.getElementById('repsButton')?.classList.remove('active');
  document.getElementById('kgButton')?.classList.remove('active');

  // Η ποιότητα εκτέλεσης "αφοπλίζεται" μετά από κάθε υπολογισμό — πρέπει να
  // επιλεγεί ξανά για το επόμενο σετ.
  workoutFailureQuality = null;
  document.querySelectorAll('[data-fq-key]').forEach(b=>b.classList.remove('active'));
}

  document.getElementById('calcClearBtn')?.addEventListener('click', clearWorkoutCalcField);
  document.getElementById('calcDeleteBtn')?.addEventListener('click', deleteWorkoutCalcNumber);

    el.addEventListener('click', ()=>{
      workoutFailureQuality = el.getAttribute('data-fq-key');

    });
  });
  document.getElementById('calcComputeBtn')?.addEventListener('click', calculateWorkoutNextWeight);
  document.getElementById('calcResetBtn')?.addEventListener('click', ()=>{
    workoutCalcField = null; workoutCalcValues = { reps:'', kg:'' };
    workoutCalcRevealed = { reps:false, kg:false };
    workoutFailureQuality = null;

    document.getElementById('kgButton')?.classList.remove('active');

function toYouTubeEmbed(url){
  const m = String(url).match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : url;
}

function onCodeInputCheck(){
  const code = document.getElementById('f-code').value.trim();
  const note = document.getElementById('match-note');
  const existing = state.customers.find(c=>c.code.toLowerCase()===code.toLowerCase());
  if(existing){

    document.getElementById('f-name').value = existing.name;
    document.getElementById('f-surname').value = existing.surname;
    document.getElementById('f-dob').value = existing.dob || '';

async function confirmSave(){
  if(state.saveBusy) return;
  const code = document.getElementById('f-code').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const surname = document.getElementById('f-surname').value.trim();
  const dob = document.getElementById('f-dob').value;
  if(!code || !name || !surname){
    toast('Συμπλήρωσε κωδικό, όνομα και επώνυμο.');
    return;
  }
  const record = buildCurrentProgramRecord();
  if(isProgramRecordEmpty(record)){
    toast('Δεν υπάρχουν ασκήσεις στο πρόγραμμα.');
    return;
  }
  record.createdByEmail = auth.email || '';
  if(state.copiedFromProgramId) record.copiedFromId = state.copiedFromProgramId;
  state.saveBusy = true;
  const btn = document.getElementById('modal-confirm');
  if(btn){ btn.disabled = true; btn.textContent='Αποθήκευση...'; }
  try{
    const okC = await upsertCustomer({ code, name, surname, dob });
    const okP = okC ? await insertProgram(code, record) : false;
    if(okC && okP){
      toast('Το πρόγραμμα αποθηκεύτηκε στο ιστορικό του πελάτη.');
      state.saveModalOpen = false;
      state.copiedFromProgramId = null;
      state.customersLoaded = false; // θα ξαναφορτωθεί φρέσκο στο επόμενο άνοιγμα του ιστορικού
      renderModal();
    } else {
      toast('Κάτι πήγε στραβά κατά την αποθήκευση. Δοκίμασε ξανά.');
    }
  }catch(e){
    console.error(e);
    toast('Σφάλμα αποθήκευσης.');
  }finally{
    state.saveBusy = false;
    if(btn){ btn.disabled=false; btn.innerHTML = ICON.save+'Αποθήκευση'; }
  }
}

const CARDIO_EQUIP_NORMALIZE = {
  'ΔΙΑΔΡΟΜΟΣ':'Διάδρομος', 'ΕΛΛΕΙΠΤΙΚΟ':'Ελλειπτικό', 'ΠΟΔΗΛΑΤΟ ΟΡΘΙΟ':'Ποδήλατο Όρθιο',
  'ΠΟΔΗΛΑΤΟ ΚΑΘΙΣΤΟ':'Ποδήλατο Καθιστό', 'ΠΟΔΗΛΑΤΟ SPINNING':'Ποδήλατο Spinning', 'ΣΚΑΛΟΠΑΤΙΑ':'Σκαλοπάτια'
};
function normalizeCardioEquipment(eq){
  return CARDIO_EQUIP_NORMALIZE[eq] || eq;
}
function extractGreekGroupKey(bilingualLabel){
  const parts = String(bilingualLabel||'').split(' - ');
  return parts[parts.length-1].trim().toUpperCase();
}
function convertTemplateToProgramRecord(t){
  const category = t.top_category === 'ΑΥΞΗΣΗ ΜΥΙΚΟΥ ΙΣΤΟΥ' ? 'muscle' : 'fatburn';
  let subtype = null;
  if(category==='fatburn'){
    if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΒΑΡΗ') subtype = 'weights';
    else if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΑΕΡΟΒΙΟ') subtype = 'cardio';
    else if(t.sub_category === 'ΚΑΥΣΗ ΛΙΠΟΥΣ ΜΕ ΒΑΡΗ ΚΑΙ ΑΕΡΟΒΙΟ') subtype = 'combo';
  }
  const tplDays = (t.data && t.data.days) || [];
  if(subtype === 'cardio'){
    const allCardioItems = [];
    tplDays.forEach(d=> (d.items||[]).forEach(it=>{ if(it.type==='cardio') allCardioItems.push({...it, equipment: normalizeCardioEquipment(it.equipment)}); }));
    return { category, subtype, notes:'', instructions:'', nutrition:null, cardioSlots: allCardioItems, days:null };
  }
  const days = tplDays.map(d=>{
    const groups = (d.items||[]).filter(it=>it.type==='muscle').map(it=>({
      exercise: it.exercise,
      groupLabel: GROUP_DISPLAY[extractGreekGroupKey(it.groupLabel)] || it.groupLabel,
      set: it.set, rep: it.rep, rest: it.rest, failure: it.failure||0, equipment: it.equipment||[]
    }));
    const cardioSlots = (d.items||[]).filter(it=>it.type==='cardio').map(it=>({...it, equipment: normalizeCardioEquipment(it.equipment)}));
    return { label: d.label, groups, cardioSlots, topSection: (cardioSlots.length && !groups.length) ? 'cardio' : 'weights' };
  });
  return { category, subtype, notes:'', instructions:'', nutrition:null, days };
}
function loadRecordIntoCustomBuilder(record, programId, mode){
  state.category = record.category;
  state.fatburnSubtype = record.subtype || null;
  state.notes = record.notes || '';
  state.instructions = record.instructions || '';
  state.nutritionSet = (record.category==='muscle' && record.nutrition && record.nutrition.setChoice) ? record.nutrition.setChoice : 3;
  if(record.category==='fatburn'){
    const m = record.nutrition && record.nutrition.kcal ? String(record.nutrition.kcal).match(/-?\d+/) : null;
    state.fatburnKcal = m ? parseInt(m[0],10) : 0;
  }
  const fixedSetRep = record.category==='fatburn'
    ? (record.subtype==='weights' ? FATBURN_WEIGHTS_FIXED : (record.subtype==='combo' ? COMBO_WEIGHTS_FIXED : null))
    : null;

  if(record.subtype === 'cardio'){
    state.cardioSlots = buildCardioSlots(6);
    (record.cardioSlots||[]).forEach((s,i)=>{
      if(state.cardioSlots[i]) Object.assign(state.cardioSlots[i], s);
    });
  } else {
    const srcDays = record.days || [];
    state.numDays = Math.max(1, srcDays.length || 4);
    const newDays = buildDays(state.numDays, fixedSetRep);
    newDays.forEach((day, di)=>{
      const srcDay = srcDays[di];
      if(!srcDay) return;
      const used = new Set();
      (srcDay.groups||[]).forEach(g=>{
        const row = day.groups.find(r=>!used.has(r.id) && r.groupLabel===g.groupLabel);
        if(row){
          used.add(row.id);
          row.selected = g.exercise;
          row.customText = '';
          if(!fixedSetRep) row.set = g.set;
          row.failure = g.failure || 0;
          row.equipment = g.equipment || [];
        }
      });
      if(record.subtype === 'combo'){
        day.cardioSlots = buildCardioSlots(4);
        (srcDay.cardioSlots||[]).forEach((s,i)=>{ if(day.cardioSlots[i]) Object.assign(day.cardioSlots[i], s); });
        day.topSection = srcDay.topSection || day.topSection;
      }
    });
    state.days = newDays;
  }
  if(mode === 'edit'){
    state.editingProgramId = programId;
    state.editingOriginalCreator = record.createdByEmail || '';
    state.copiedFromProgramId = null;
  } else {
    state.copiedFromProgramId = programId;
    state.editingProgramId = null;
    state.editingOriginalCreator = '';
  }
  state.tab = 'builder';
  render();
  toast(mode==='edit'
    ? 'Το πρόγραμμα φορτώθηκε για διόρθωση — οι αλλαγές σου θα ενημερώσουν αυτή την ίδια καταχώρηση.'
    : 'Το πρόγραμμα φορτώθηκε στον Builder — κάνε τις αλλαγές σου και πάτησε Αποθήκευση για νέα καταχώρηση.');
}
function getProgramNameForRecord(record){
  if(record && record.fromTemplate && record.templateName) return record.templateName;
  return record ? categoryBadgeLabel(record) : '';
}
function categoryBadgeLabel(record){
  if(record.category==='muscle') return CATEGORY_INFO.muscle.title;
  if(record.subtype) return FATBURN_SUBTYPES[record.subtype].title;
  return CATEGORY_INFO.fatburn.title;
}

const FOOD_MEAL_TYPES = [
  { key:'breakfast', label:'Πρωινό' },
  { key:'lunch',     label:'Μεσημεριανό' },
  { key:'snack',     label:'Σνακ' },
  { key:'dinner',    label:'Βραδινό' }
];
const FOOD_CONFIDENCE_LABEL = { low:'χαμηλή', medium:'μέτρια', high:'υψηλή' };

const food = {
  date: foodLocalISO(new Date()),
  meals: [],
  loadedFor: null,   // ποια ημερομηνία έχει φορτωθεί
  loading: false,
  draft: null,       // { stage:'photo'|'analyzing'|'review', imgDataUrl, b64, note, items, mealType, confidence, comment, source }
  recent: null,      // τρόφιμα που έχει φάει πρόσφατα ο πελάτης (για γρήγορη επιλογή)
  recentLoading: false
};

function foodLocalISO(d){
  const z = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
function foodShiftDate(iso, days){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+days);
  return foodLocalISO(dt);
}
function foodDateLabel(iso){
  const today = foodLocalISO(new Date());
  if(iso===today) return 'Σήμερα';
  if(iso===foodShiftDate(today,-1)) return 'Χθες';
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('el-GR',{ weekday:'short', day:'numeric', month:'short' });
}
function foodDefaultMealType(){
  const h = new Date().getHours();
  if(h<11) return 'breakfast';
  if(h<16) return 'lunch';
  if(h<19) return 'snack';
  return 'dinner';
}
function foodMealTypeLabel(k){ const t = FOOD_MEAL_TYPES.find(x=>x.key===k); return t ? t.label : 'Γεύμα'; }
function foodR1(v){ const n = Number(v); return Number.isFinite(n) && n>0 ? Math.round(n*10)/10 : 0; }
function foodSum(items){
  return items.reduce((a,it)=>({
    kcal: a.kcal + (Number(it.kcal)||0),
    p: a.p + (Number(it.protein_g)||0),
    c: a.c + (Number(it.carbs_g)||0),
    f: a.f + (Number(it.fat_g)||0)
  }), { kcal:0, p:0, c:0, f:0 });
}
function foodWithBase(it){
  const x = { name:it.name||'', grams:foodR1(it.grams), kcal:Math.round(Number(it.kcal)||0),
              protein_g:foodR1(it.protein_g), carbs_g:foodR1(it.carbs_g), fat_g:foodR1(it.fat_g) };
  x._base = { grams:x.grams, kcal:x.kcal, protein_g:x.protein_g, carbs_g:x.carbs_g, fat_g:x.fat_g };
  return x;
}

/* ---------- Supabase ---------- */
async function loadMealLogs(dateISO){
  const { data, error } = await sb.from('meal_logs').select('*')
    .eq('user_id', auth.user.id).eq('meal_date', dateISO)
    .order('created_at', { ascending:true });
  if(error){ console.error('meal_logs load error', error); toast('Σφάλμα φόρτωσης γευμάτων.'); return []; }
  return data || [];
}
async function insertMealLog(row){
  const { error } = await sb.from('meal_logs').insert(row);
  if(error){ console.error('meal_logs insert error', error); return false; }
  return true;
}
async function deleteMealLog(id){
  const { error } = await sb.from('meal_logs').delete().eq('id', id);
  if(error){ console.error('meal_logs delete error', error); return false; }
  return true;
}
async function analyzeMealPhoto(b64, note, raw){
  const { data, error } = await sb.functions.invoke('analyze-meal', {
    body: { image: b64, media_type: 'image/jpeg', note: note || '', raw: !!raw }
  });
  if(error){
    let msg = 'Η ανάλυση απέτυχε. Δοκίμασε ξανά.';
    try{
      if(error.context && typeof error.context.json === 'function'){
        const j = await error.context.json();
        if(j && j.message) msg = j.message;
      }
    }catch(_){}
    throw new Error(msg);
  }
  return data;
}

/* ---------- Συμπίεση φωτογραφίας (μικρότερο αρχείο = γρηγορότερο & φθηνότερο) ---------- */
function foodCompressImage(file, maxSide){
  maxSide = maxSide || 1024;
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth*scale), h = Math.round(img.naturalHeight*scale);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      resolve({ dataUrl, b64: dataUrl.split(',')[1] });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Δεν μπόρεσα να διαβάσω τη φωτογραφία.')); };
    img.src = url;
  });
}

/* ---------- Render ---------- */
async function renderClientNutrition(){
  const content = document.getElementById('client-content');
  if(!content || !auth.customer) return;
  fdbLoad(); foodLoadRecent();   // βάση τροφίμων & πρόσφατα (στο παρασκήνιο)
  if(food.loadedFor !== food.date && !food.loading){
    food.loading = true;
    content.innerHTML = `<div style="color:var(--ink-soft);">Φόρτωση...</div>`;
    const dateAtStart = food.date;
    const rows = await loadMealLogs(dateAtStart);
    food.loading = false;
    if(dateAtStart !== food.date){ return renderClientNutrition(); }
    food.meals = rows; food.loadedFor = dateAtStart;
    if(state.clientViewMode !== 'food') return;
  }
  content.innerHTML = food.draft ? renderFoodDraft() : renderFoodDay();
  bindFoodEvents();
}

function renderFoodTarget(){
  const p = (state.selectedCustomerPrograms||[])[0];
  const n = p && p.record ? p.record.nutrition : null;
  if(!n) return '';
  if(typeof n === 'string') return `<div class="food-target"><b>Διατροφή από το πρόγραμμά σου:</b><br>${escNL(n)}</div>`;
  if(n.kcal) return `<div class="food-target">Στόχος από το πρόγραμμά σου: <b>${escHtml(n.kcal)}</b> σε σχέση με τις θερμίδες συντήρησής σου.</div>`;
  return '';
}

        <button class="btn btn-outline" data-food-day="1" ${isToday?'disabled style="opacity:.35;"':''} aria-label="Επόμενη ημέρα">›</button>
      </div>
      <div class="food-totals">
        <div class="food-tile kcal"><div class="v">${Math.round(t.kcal)}</div><div class="k">kcal</div></div>
        <div class="food-tile"><div class="v">${Math.round(t.p)}</div><div class="k">Πρωτ. γ</div></div>
        <div class="food-tile"><div class="v">${Math.round(t.c)}</div><div class="k">Υδατ. γ</div></div>
        <div class="food-tile"><div class="v">${Math.round(t.f)}</div><div class="k">Λιπαρά γ</div></div>
      </div>
      ${renderFoodTarget()}

      <div class="food-actions">
        <label class="btn btn-primary full" style="cursor:pointer;">📷 Φωτογράφισε το γεύμα
          <input type="file" accept="image/*" capture="environment" id="food-cam" style="display:none;">
        </label>
        <label class="btn btn-outline" style="cursor:pointer;">🖼️ Από συλλογή
          <input type="file" accept="image/*" id="food-gallery" style="display:none;">
        </label>
        <button class="btn btn-outline" id="food-manual">✍️ Χειροκίνητα</button>
      </div>
      <div class="food-note" style="margin:-6px 0 16px;text-align:center;">📸 Φωτογράφισε <b>από πάνω</b>, με ένα <b>πιρούνι δίπλα</b> στο πιάτο, για καλύτερη εκτίμηση.</div>

      <div class="section-title"><span class="dot"></span>Γεύματα</div>
      ${mealsHtml}
      <div class="food-note">Οι τιμές από φωτογραφία είναι <b>εκτίμηση</b> και όχι ακριβής μέτρηση — λάδι, σάλτσες και μέγεθος μερίδας δεν φαίνονται πάντα. Για ακρίβεια, διόρθωσε τα γραμμάρια πριν την αποθήκευση. Δεν αποτελεί ιατρική ή διαιτολογική συμβουλή.</div>
